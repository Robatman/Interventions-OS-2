<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LDR VR World - Técnicas Distribuidas</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
    #voice-indicator {
      position: absolute; top: 10px; left: 10px; z-index: 999;
      background: rgba(0,0,0,0.7); color: #fff; padding: 6px 12px;
      border-radius: 4px; font-size: 14px; display: none; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="voice-indicator">Escuchando...</div>

  <a-scene>
    <a-assets>
      </a-assets>

    <a-sky color="#030712"></a-sky>
    <a-entity id="stars-1" particle-system="preset: stars; particleCount: 500" position="0 0 0"></a-entity>
    
    <a-light type="ambient" color="#334155" intensity="0.6"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="5 10 3"></a-light>
    <a-light type="point" color="#00e5c0" intensity="0.4" position="0 2 -2"></a-light>

    <a-grid static-body geometry="primitive: plane; width: 100; height: 100" 
            material="color: #0f172a; opacity: 0.8; src: url(https://cdn.aframe.io/a-grid/grid_dark.png); repeat: 50 50" 
            rotation="-90 0 0" position="0 0 0"></a-grid>

    <a-entity id="cameraRig" position="0 0 0">
      <a-entity id="head" camera look-controls position="0 1.6 0">
        <a-cursor id="main-cursor"
                  raycaster="objects: .clickable"
                  material="color: #00e5c0; shader: flat; opacity: 0.8"
                  geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                  position="0 0 -1"
                  animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                  animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1500; from: 1 1 1; to: 0.1 0.1 0.1"
                  animation__mouseleave="property: scale; startEvents: mouseleave; easing: easeInCubic; dur: 500; to: 1 1 1">
        </a-cursor>
      </a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 10"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 10"></a-entity>
    </a-entity>

    <a-entity id="juanjolote" position="0 1.2 -4.5" rotation="0 0 0">
      <a-cone radius-bottom="0.25" radius-top="0.05" height="1.2" color="#1e293b" material="wireframe: false; opacity:0.9"></a-cone>
      <a-box id="juan-head" width="0.5" height="0.4" depth="0.4" position="0 0.7 0" color="#f472b6">
        <a-sphere radius="0.04" color="#000" position="-0.15 0.05 0.21"></a-sphere>
        <a-sphere radius="0.04" color="#000" position="0.15 0.05 0.21"></a-sphere>
        <a-sphere radius="0.015" color="#fff" position="-0.16 0.07 0.23"></a-sphere>
        <a-sphere radius="0.015" color="#fff" position="0.14 0.07 0.23"></a-sphere>
        <a-box width="0.15" height="0.05" depth="0.05" position="-0.3 0.1 0" color="#ec4899" rotation="0 0 20"></a-box>
        <a-box width="0.18" height="0.05" depth="0.05" position="-0.32 0 0" color="#ec4899" rotation="0 0 0"></a-box>
        <a-box width="0.15" height="0.05" depth="0.05" position="-0.3 -0.1 0" color="#ec4899" rotation="0 0 -20"></a-box>
        <a-box width="0.15" height="0.05" depth="0.05" position="0.3 0.1 0" color="#ec4899" rotation="0 0 -20"></a-box>
        <a-box width="0.18" height="0.05" depth="0.05" position="0.32 0 0" color="#ec4899" rotation="0 0 0"></a-box>
        <a-box width="0.15" height="0.05" depth="0.05" position="0.3 -0.1 0" color="#ec4899" rotation="0 0 20"></a-box>
        <a-entity id="juan-mouth" geometry="primitive: torus; radius: 0.04; radiusTubular: 0.01; arc: 180" material="color: #451a03" position="0 -0.1 0.21" rotation="0 0 180"></a-entity>
      </a-box>
      <a-ring radius-inner="0.4" radius-outer="0.45" color="#00e5c0" rotation="-90 0 0" position="0 -0.58 0" material="shader:flat; opacity:0.6"></a-ring>
    </a-entity>


    <a-entity id="screen-welcome" visible="true" position="0 0 0">
      <a-text value="LEADERSHIP SIMULATOR VR" align="center" color="#ffffff" width="5" position="0 2.5 -3" font="mozillavr"></a-text>
      <a-text value="Desarrolla tus habilidades de liderazgo en entornos seguros" align="center" color="#94a3b8" width="3" position="0 2.2 -3" font="mozillavr"></a-text>

        <a-plane width="1.64" height="0.84" color="#6366f1" material="opacity:0.4; transparent:true; shader:flat" position="0 0 -0.01"></a-plane>
        <a-text value="INTERVENCIONES" align="center" color="#ffffff" width="3.5" position="0 0.15 0.02" font="mozillavr"></a-text>

        <a-plane width="1.64" height="0.84" color="#10b981" material="opacity:0.4; transparent:true; shader:flat" position="0 0 -0.01"></a-plane>

        <a-text value="Practica herramientas de comunicacion aisladas" align="center" color="#a7f3d0" width="2.4" position="0 -0.15 0.02" wrap-count="25" font="mozillavr"></a-text>
      </a-entity>

      <a-entity id="btn-logout" position="0 0.6 -3" class="clickable">

        <a-text value="Cerrar Sesion" align="center" color="#fca5a5" width="2.5" position="0 0 0.01" font="mozillavr"></a-text>
      </a-entity>

        <a-text id="eval-level" value="Nivel: --" align="left" color="#a7f3d0" width="3" position="0.1 0.4 0.02" font="mozillavr"></a-text>
        
        <a-text id="eval-feedback" value="Analizando tu conversacion..." align="center" color="#e2e8f0" width="2.7" position="0 -0.2 0.02" wrap-count="32" font="mozillavr"></a-text>
      </a-entity>

      <a-entity id="btn-new-session" position="-0.8 0.6 -3" class="clickable">
        <a-plane width="1.2" height="0.3" color="#064e3b" material="opacity:0.9; shader:flat"></a-plane>
        <a-text value="Menu Principal" align="center" color="#ffffff" width="2.5" position="0 0 0.01" font="mozillavr"></a-text>
      </a-entity>

      <a-entity id="btn-practice-again" position="0.8 0.6 -3" class="clickable">
        <a-plane width="1.2" height="0.3" color="#1e1b4b" material="opacity:0.9; shader:flat"></a-plane>
        <a-text value="Reintentar" align="center" color="#ffffff" width="2.5" position="0 0 0.01" font="mozillavr"></a-text>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    // --- ESTADO GLOBAL DE LA APLICACIÓN ---
    var appState = {
      screen: 'welcome',       // Pantalla activa: 'welcome','technique-list','mode','practice','eval'
      activeMenu: 'interventions', // Opciones primarias: 'interventions' o 'techniques'
      selectedTechnique: null, // ID de la técnica seleccionada
      currentTechnique: null,  // Datos del set de simulación activo
      turns: 0,
      maxTurns: 4,
      history: []
    };

    // Variables globales para captura de Voz
    var recognition = null;
    var isRecording = false;
    var isProcessing = false;
    var synth = window.speechSynthesis;

    // --- MANEJO DE PANTALLAS ---
    function showScreen(name) {
      var screens = ['welcome', 'technique-list', 'mode', 'practice', 'eval'];
      screens.forEach(function(s) {
        var el = document.getElementById('screen-' + s);
        if (el) {
          el.setAttribute('visible', s === name);
          // Mover lejos del alcance si no está visible para evitar clics fantasma
          if (s === name) {
            el.setAttribute('position', '0 0 0');
          } else {
            el.setAttribute('position', '0 -100 0');
          }
        }
      });
      appState.screen = name;
    }

    function goWelcome() {
      showScreen('welcome');
      setJuanMood('happy');
      speakVR("Menu de inicio. Elige una opcion para comenzar.", "daniel");
    }

    function goMode(menuType) {
      appState.activeMenu = menuType;
      
      // Actualizar visualmente la ruta en la pantalla de modos
      var modeSubtitle = document.getElementById('mode-subtitle');
      if (modeSubtitle) {
        if (menuType === 'techniques' && appState.selectedTechnique) {
          var cleanName = appState.selectedTechnique.toUpperCase().replace(/_/g, ' ');
          modeSubtitle.setAttribute('text', 'value', 'Ruta: TECNICAS -> ' + cleanName);
        } else {
          modeSubtitle.setAttribute('text', 'value', 'Ruta: INTERVENCIONES OPERATIVAS');
        }
      }
      
      showScreen('mode');
      speakVR("Elige la modalidad: Practice para simular por voz, Learn para teoria o Work para herramientas.", "daniel");
    }

    // --- ACCIONES DE MODALIDAD (DESTINOS PRINCIPALES) ---
    function goPractice() {
      // 1. Configurar datos semilla según la selección previa
      if (appState.activeMenu === 'techniques') {
        var cleanTechName = (appState.selectedTechnique || "active_listening").replace(/_/g, ' ');
        appState.currentTechnique = {
          title: cleanTechName.toUpperCase(),
          initial_greet: "Hola, soy tu colaborador. Hagamos una simulacion enfocada en la tecnica de " + cleanTechName + ". ¿Como quieres empezar?",
          character: "Colaborador Practicante"
        };
      } else {
        appState.currentTechnique = {
          title: "INTERVENCION OPERATIVA",
          initial_greet: "Buenas tardes jefe. Tenemos un problema en la linea de operaciones y ocupo su guia. ¿Que hacemos?",
          character: "Supervisor de Linea"
        };
      }

      // 2. Resetear contadores de simulación
      appState.turns = 0;
      appState.history = [];
      
      // 3. Renderizar textos en pantalla
      var roleText = document.getElementById('practice-role');
      if (roleText) roleText.setAttribute('text', 'value', appState.currentTechnique.title);
      
      var juanText = document.getElementById('juan-text');
      if (juanText) juanText.setAttribute('text', 'value', appState.currentTechnique.initial_greet);

      showScreen('practice');
      setJuanMood('happy');
      
      // 4. Hablar el saludo inicial
      setTimeout(function() {
        speakVR(appState.currentTechnique.initial_greet, 'daniel');
      }, 600);
    }

    function goLearn() {
      var techLabel = appState.activeMenu === 'techniques' ? appState.selectedTechnique : 'Intervenciones';
      alert("Abriendo modulo teorico para: " + techLabel);
    }

    function goWork() {
      var techLabel = appState.activeMenu === 'techniques' ? appState.selectedTechnique : 'Intervenciones';
      alert("Cargando plantillas de trabajo para: " + techLabel);
    }

    function goEval() {
      // Generar score artificial para la muestra
      var score = Math.floor(Math.random() * 30) + 70; // 70-99%
      var level = score >= 90 ? "Experto" : "Competente";
      
      var scoreEl = document.getElementById('eval-score');
      if (scoreEl) scoreEl.setAttribute('text', 'value', 'Score: ' + score + '%');
      
      var levelEl = document.getElementById('eval-level');
      if (levelEl) levelEl.setAttribute('text', 'value', 'Nivel: ' + level);
      
      var feedEl = document.getElementById('eval-feedback');
      if (feedEl) {
        var msg = "Buen manejo de la estructura general. Demostraste un uso adecuado de los tiempos de escucha. Puedes mejorar afinando las propuestas concretas al cierre.";
        feedEl.setAttribute('text', 'value', msg);
      }

      showScreen('eval');
      setJuanMood('happy');
      speakVR("Simulacion concluida. Revisa tu evaluacion en el tablero frontal.", "daniel");
    }


    // --- CONTROL DE RECONOCIMIENTO DE VOZ (WEB SPEECH API) ---
    function setupMic() {
      return new Promise(function(resolve) {
        var Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) {
          console.warn("Speech recognition no soportado en este navegador.");
          return resolve();
        }
        recognition = new Speech();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'es-MX';

        recognition.onstart = function() {
          isRecording = true;
          document.getElementById('voice-indicator').style.display = 'block';
          var ring = document.getElementById('mic-ring');
          if (ring) ring.setAttribute('material', 'color', '#22c55e'); // Verde al escuchar
        };

        recognition.onend = function() {
          isRecording = false;
          document.getElementById('voice-indicator').style.display = 'none';
          var ring = document.getElementById('mic-ring');
          if (ring) ring.setAttribute('material', 'color', '#fda4af');
        };

        recognition.onresult = function(event) {
          if (event.results && event.results[0]) {
            var text = event.results[0][0].transcript;
            processUserVoice(text);
          }
        };
        resolve();
      });
    }

    function startRecording() {
      if (recognition && !isRecording && !isProcessing) {
        synth.cancel(); // Corta el habla de la IA si el usuario interrumpe
        recognition.start();
      }
    }

    function stopRecording() {
      if (recognition && isRecording) {
        recognition.stop();
      }
    }

    function processUserVoice(text) {
      if (!text || text.trim() === "") return;
      
      isProcessing = true;
      appState.turns++;

      // Mostrar texto del usuario temporalmente en la pantalla
      var juanText = document.getElementById('juan-text');
      if (juanText) juanText.setAttribute('text', 'value', 'Tu: "' + text + '"');

      // Simular respuesta corta de Juanjolote (En producción aquí conectas tu API/Fetch)
      setTimeout(function() {
        var aiReply = "Entiendo lo que comentas. Sigamos profundizando en la situacion para resolverlo mejor.";
        
        if (appState.turns >= appState.maxTurns) {
          if (juanText) juanText.setAttribute('text', 'value', 'Juanjolote: Entendido jefe. Creo que tenemos suficiente informacion. Evaluemos la sesion.');
          speakVR("Entendido jefe. Creo que tenemos suficiente informacion. Evaluemos la sesion.", "daniel");
          setTimeout(goEval, 4000);
        } else {
          if (juanText) juanText.setAttribute('text', 'value', 'Juanjolote: ' + aiReply);
          setJuanMood('talk');
          speakVR(aiReply, 'daniel');
        }
        isProcessing = false;
      }, 1500);
    }


    // --- TEXT TO SPEECH (SALIDA DE AUDIO DE LA IA) ---
    function speakVR(text, voiceType) {
      if (!synth) return;
      synth.cancel();
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-MX';
      
      utterance.onend = function() {
        setJuanMood('happy');
      };
      synth.speak(utterance);
    }

    // --- CAMBIO DE ANIMACIÓN / EXPRESIÓN DE JUANJOLOTE ---
    function setJuanMood(mood) {
      var head = document.getElementById('juan-head');
      var mouth = document.getElementById('juan-mouth');
      if (!head || !mouth) return;

      if (mood === 'talk') {
        head.setAttribute('color', '#f472b6');
        mouth.setAttribute('geometry', {primitive: 'torus', radius: 0.02, radiusTubular: 0.01, arc: 360});
      } else if (mood === 'thinking') {
        head.setAttribute('color', '#c084fc');
        mouth.setAttribute('geometry', {primitive: 'torus', radius: 0.04, radiusTubular: 0.005, arc: 180});
      } else { // happy / normal
        head.setAttribute('color', '#f472b6');
        mouth.setAttribute('geometry', {primitive: 'torus', radius: 0.04, radiusTubular: 0.01, arc: 180});
        mouth.setAttribute('rotation', '0 0 180');
      }
    }


    // ========================================================
    // --- MAPEO DE INTERACCIONES AL CARGAR LA ESCENA ---
    // ========================================================
    document.addEventListener('DOMContentLoaded', function() {
      
      // --- NAVEGACIÓN MENÚ INICIAL ---
      var btnInt = document.getElementById('btn-interventions');
      if (btnInt) {
        btnInt.addEventListener('click', function(e) {
          e.stopPropagation();
          goMode('interventions');
        });
      }

      var btnTech = document.getElementById('btn-techniques');
      if (btnTech) {
        btnTech.addEventListener('click', function(e) {
          e.stopPropagation();
          showScreen('technique-list'); // Muestra la rejilla de los 14 botones
        });
      }

      var btnTechBack = document.getElementById('btn-tech-list-back');
      if (btnTechBack) {
        btnTechBack.addEventListener('click', function(e) {
          e.stopPropagation();
          goWelcome();
        });
      }

      // --- CAPTURA DINÁMICA AUTOMÁTICA DE LAS 14 TÉCNICAS ---
      var techListScreen = document.getElementById('screen-technique-list');
      if (techListScreen) {
        techListScreen.addEventListener('click', function(e) {
          var targetEntity = e.target;
          
          // Escala hacia arriba en la jerarquía 3D para encontrar el ID del botón que fue clickeado
          while (targetEntity && targetEntity !== techListScreen) {
            if (targetEntity.id && targetEntity.id.startsWith('btn-') && targetEntity.id !== 'btn-tech-list-back') {
              e.stopPropagation();
              
              // Formatea el ID (ejemplo: 'btn-active-listening' -> 'active_listening')
              var techniqueId = targetEntity.id.replace('btn-', '').replace(/-/g, '_');
              appState.selectedTechnique = techniqueId;
              
              goMode('techniques'); // Te transfiere directo a la pantalla de modos
              return;
            }
            targetEntity = targetEntity.parentNode;
          }
        });
      }

      // --- NAVEGACIÓN MODALIDADES (PRACTICE, LEARN, WORK) ---
      var btnPractice = document.getElementById('btn-practice');
      if (btnPractice) {
        btnPractice.addEventListener('click', function(e) {
          e.stopPropagation();
          goPractice();
        });
      }

      var btnLearn = document.getElementById('btn-learn');
      if (btnLearn) {
        btnLearn.addEventListener('click', function(e) {
          e.stopPropagation();
          goLearn();
        });
      }

      var btnWork = document.getElementById('btn-work');
      if (btnWork) {
        btnWork.addEventListener('click', function(e) {
          e.stopPropagation();
          goWork();
        });
      }

      var btnModeBack = document.getElementById('mode-back-btn');
      if (btnModeBack) {
        btnModeBack.addEventListener('click', function(e) {
          e.stopPropagation();
          if (appState.activeMenu === 'techniques') {
            showScreen('technique-list');
          } else {
            goWelcome();
          }
        });
      }

      // --- PANTALLAS COMPLEMENTARIAS (MIC, EVAL, LOGOUT) ---
      var micBtn = document.getElementById('mic-btn');
      if (micBtn) {
        micBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (appState.screen === 'practice') {
            if (!isRecording && !isProcessing) startRecording();
            else if (isRecording) stopRecording();
          }
        });
      }

      var btnEnd = document.getElementById('btn-end-practice');
      if (btnEnd) {
        btnEnd.addEventListener('click', function(e) {
          e.stopPropagation();
          goEval();
        });
      }

      var btnNew = document.getElementById('btn-new-session');
      if (btnNew) {
        btnNew.addEventListener('click', function(e) {
          e.stopPropagation();
          goWelcome();
        });
      }

      var btnAgain = document.getElementById('btn-practice-again');
      if (btnAgain) {
        btnAgain.addEventListener('click', function(e) {
          e.stopPropagation();
          goPractice();
        });
      }

      var btnLogout = document.getElementById('btn-logout');
      if (btnLogout) {
        btnLogout.addEventListener('click', function(e) {
          e.stopPropagation();
          localStorage.removeItem('ldr_session_token');
          localStorage.removeItem('ldr_refresh_token');
          window.location.href = 'login-vr.html';
        });
      }

      // --- CARGA INICIAL DE LA ESCENA VR ---
      var sceneEl = document.querySelector('a-scene');
      if (sceneEl) {
        sceneEl.addEventListener('loaded', function() {
          setupMic().then(function() {
            var gameId = localStorage.getItem('ldr_game_id') || '';
            var name = gameId.split('.')[1] || 'Manager';
            var greet = "Bienvenido " + name + ". Soy Juanjolote. Selecciona Intervenciones para resolver casos operativos, o Tecnicas para entrenar habilidades especificas.";
            setTimeout(function() { 
              setJuanMood('happy'); 
              speakVR(greet, 'daniel'); 
            }, 800);
          });

          // Animación de rotación continua del cielo estrellado
          var stars = document.getElementById('stars-1');
          if (stars) {
            stars.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 180000; easing: linear');
          }
        });
      }

    });
  </script>
</body>
</html>
