<script>  
AFRAME.registerComponent('handler-botones-vr', {
  schema: {
    mensaje: {type: 'string', default: 'Botón presionado'},
    tecnica: {type: 'string', default: 'generica'}
  },
  
  init: function () {
    var el = this.el;
    var data = this.data;

    el.addEventListener('click', function (evt) {
      // 🔒 Validamos que el botón pertenezca a una jerarquía completamente visible y con escala real
      if (el.object3D) {
        let current = el.object3D;
        let isHierarchyActive = true;
        
        while (current) {
          if (current.visible === false || current.scale.x === 0) {
            isHierarchyActive = false;
            break;
          }
          current = current.parent;
        }

        if (!isHierarchyActive) {
          return; // Detiene por completo la ejecución si la pantalla está inactiva
        }
      }

      if (evt.detail && evt.detail.sourceEvent) {
        evt.detail.sourceEvent.stopPropagation();
        evt.detail.sourceEvent.preventDefault();
      }
      evt.stopPropagation(); 
      
      // console.log(`🎯 [VR Click] ${data.mensaje} (ID: ${el.id ||i8 el.parentElement.id})`);
      ejecutarFuncionPorTecnica(data.tecnica);
    });
  }
});



function cambiarPantallaVR(pantallaMostrarId) {
  const pantallas = [
    'screen-welcome', 
    'screen-mode', 
    'screen-interventions-list', 
    'screen-technique-list',
    'screen-interventions', 
    'screen-learn-work-practice', 
    'screen-history',
    'screen-practice',              
    'screen-eval',                   
    'screen-active-listening-activity',
    'screen-level-selector'
  ];
  
  pantallas.forEach(id => {
    const elPantalla = document.getElementById(id);
    if (!elPantalla) return;

    if (id === pantallaMostrarId) {
      elPantalla.setAttribute('visible', 'true');
      elPantalla.setAttribute('scale', '1 1 1');
      
      // 🌟 REGLA ESPECIAL PARA TU BOTÓN Y PERSONAJES:
      if (id === 'screen-active-listening-activity') {
        const btnToggle = document.getElementById('btn-toggle-active-listening');
        if (btnToggle) btnToggle.setAttribute('visible', 'true');
        
        // Inicializa el estado para que Juanjolote siempre empiece del lado izquierdo
        if (typeof initActiveListeningConversation === 'function') {
          initActiveListeningConversation();
        }
      }
    } else {
      elPantalla.setAttribute('visible', 'false');
      elPantalla.setAttribute('scale', '0 0 0');
    }
  });

  // Forzamos al raycaster de la escena a recalcular los botones activos inmediatamente
  const raycasterEl = document.querySelector('[raycaster]');
  if (raycasterEl && raycasterEl.components.raycaster) {
    raycasterEl.components.raycaster.refreshObjects();
  }
}

function ejecutarFuncionPorTecnica(tecnica) {
  // console.log("⚡ Buscando técnica:", tecnica);

  // cambiarPantallaVR(''); 

  switch(tecnica) {
   case 'active-listening': selectAndPreviewVR('active_listening'); break;
    case 'powerful-questions': selectAndPreviewVR('powerful_questions'); break;
    case 'motivational-interviewing': selectAndPreviewVR('motivational_interviewing'); break;
    case 'nonviolent-communication': selectAndPreviewVR('nonviolent_communication'); break;
    case 'radical-candor': selectAndPreviewVR('radical_candor'); break;
    case 'crucial-conversations': selectAndPreviewVR('crucial_conversations'); break;
    case 'tactical-empathy': selectAndPreviewVR('tactical_empathy'); break;
    case 'scarf-model': selectAndPreviewVR('scarf_model'); break;
    case 'immunity-to-change': selectAndPreviewVR('immunity_to_change'); break;
    case 'drama-triangle': selectAndPreviewVR('drama_triangle'); break;
    case 'grow-model': selectAndPreviewVR('grow_model'); break;
    case 'strengths-based-coaching': selectAndPreviewVR('strengths_based_coaching'); break;
    case 'growth-mindset': selectAndPreviewVR('growth_mindset'); break;
    case 'solution-focused-coaching': selectAndPreviewVR('solution_focused_coaching'); break;
    

    case 'interv-pulse-check': funcionIntervPulseCheck(); break;
    case 'interventions': funcionShowInterventions(); break;
    case 'techniques': funcionShowtechniques(); break;


    case 'interv-retencion': funcionIntervRetencion(); break;
    case 'interv-fidelizacion': funcionIntervFidelizacion(); break;
    case 'interv-soporte-critico': funcionIntervSoporteCritico(); break;
    case 'interv-reclamaciones': funcionIntervReclamaciones(); break;
    case 'interv-tenure-renewal': funcionIntervTenureRenewal(); break;

    case 'learn-intervention': goLearn(); break;
    case 'work-together-intervention': goWork(); break;
    
     case 'progress': 
      // console.log("📊 Abriendo historial de progreso..."); 
      goHistory(); 
      break;

    case 'close-history':
      // console.log("🔄 Regresando a la pantalla de bienvenida...");
      cambiarPantallaVR('screen-welcome');
      break;

      case 'practice-intervention': 
      // console.log("🎚️ Abriendo selector de niveles para la práctica VR...");
      cambiarPantallaVR('screen-level-selector'); 
      break;


      case 'level-novice':
            appState.currentLevel = 'novice';
            appState.evaluacionHabilitada = true;
            // console.log("Dificultad fijada en: Novato. Evaluación Habilitada.");
            goPractice(); 
            break;

          case 'level-intermediate':
            appState.currentLevel = 'intermediate';
            appState.evaluacionHabilitada = true;
            // console.log("Dificultad fijada en: Intermedio. Evaluación Habilitada.");
            goPractice(); 
            break;

          case 'level-expert':
            appState.currentLevel = 'expert';
            appState.evaluacionHabilitada = true;
            // console.log("Dificultad fijada en: Experto. Evaluación Habilitada.");
            goPractice(); 
            break;

    case 'back-to-learn-work':
      cambiarPantallaVR('screen-learn-work-practice');
      break;
    
    
    default: 
      // console.log("⚡ Ejecutando función genérica de la academia.");
      break;
  }
}

function funcionShowInterventions(){
    // console.log("Cambiando a pantalla de intervenciones");
    appState.activeMenu = 'interventions';    
    if(typeof cambiarPantallaVR==='function'){
        cambiarPantallaVR('screen-interventions');
    }else{
        showScreen('interventions');
    }
}

function funcionShowtechniques(){
    // console.log("Cambiando a pantalla de tecnicas");
    appState.activeMenu = 'techniques';
    cambiarPantallaVR('screen-technique-list'); 
}

  var w=0.07+pct*0.63,x=-0.315+pct*0.315;
  var fill=document.getElementById('mood-fill'),pctEl=document.getElementById('mood-pct');
  if(fill){fill.setAttribute('color',color);fill.setAttribute('width',w);fill.setAttribute('position',x+' 0.02 0.015');}
  if(pctEl)pctEl.setAttribute('text','value',appState.vrMood+'%');
}

async function callGroqLLM(mode){
  var systemPrompt='';
  if(mode==='practice'){
    systemPrompt=PROMPTS.avatar(appState.currentLevel);
  } else if(mode==='learn'){
    systemPrompt='Eres Juanjolote, coach de liderazgo calido y directo en Centris Neural Academy. Estas ensenando sobre '+(appState.activeMenu==='interventions'?'intervenciones de retencion':'tecnicas de comunicacion')+'. Habla en espanol. Conversacional, maximo 3 oraciones. Haz preguntas. Nunca des conferencias. Conecta todo a situaciones reales de call center.';
  } else if(mode==='work'){
    systemPrompt='Eres Juanjolote, coach socratico en Centris Neural Academy. Tu rol es hacer preguntas que ayuden al manager a descubrir sus propios insights. NUNCA des consejos directos. Haz UNA pregunta a la vez. Maximo 2 oraciones. Habla en espanol. Se calido pero directo.';
  }
  var res=await fetch('/api/groq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:systemPrompt},...appState.agentHistory.slice(-12)],max_tokens:150,temperature:0.88})});
  var data=await res.json();
  return (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'...';
}

function parseAgentReply(raw){
  var moodMatch=raw.match(/\[MOOD:(\d+)\]/),boxMatch=raw.match(/\[BOX:(in|out)\]/);
  var msg=raw.replace(/\[MOOD:\d+\]/g,'').replace(/\[BOX:(in|out)\]/g,'').replace(/\[TRIGGER:\w+\]/g,'').replace(/\[CLOSED:(true|false)\]/g,'').trim();
  return {msg:msg,newMood:moodMatch?parseInt(moodMatch[1]):appState.vrMood,boxState:boxMatch?boxMatch[1]:appState.boxState};
}

async function handleVRSpeech(text) {
  if (!text.trim()) return;
  var mode = appState.currentArchetype ? 'practice' : 'learn';
  appState.agentHistory.push({ role: 'user', content: text });
  
  try {
    var reply = await callGroqLLM(mode === 'practice' ? 'practice' : appState.activeMenu ? 'learn' : 'work');
    var parsed = mode === 'practice' ? parseAgentReply(reply) : { msg: reply, newMood: appState.vrMood, boxState: 'out' };
    appState.agentHistory.push({ role: 'assistant', content: reply });
    
    if (mode === 'practice') {
      updateVRMood(parsed.newMood);
      appState.boxState = parsed.boxState;
      if (parsed.newMood > 60) setAjolinMood('happy');
      else if (parsed.newMood < 30) setAjolinMood('sad');
      else setAjolinMood('talking');

async function speakVR(text, voice = "Fritz-PlayAI", callback = null) {

  // ❌ ELIMINA O COMENTA ESTA LÍNEA (Ya no necesitas traducir un texto que ya viene en inglés):
  // const englishText = await translateToEnglish(text);

  // pedir audio
  const speechResponse = await fetch('/api/groq_speakvr', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      type: 'speech',
      text: text, //  <-- CAMBIA 'englishText' por 'text' para usar el texto original directo
      voice: voice
    })
  });

  if (!speechResponse.ok) {
    const err = await speechResponse.text();
    console.error("TTS ERROR:", err);
    return;
  }

  const blob = await speechResponse.blob();
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);

  audio.onended = () => {
    URL.revokeObjectURL(url);
    if (callback) {
      callback();
    }
  };

  await audio.play();
}

async function setupMic(){
  try{
    // console.log('[Mic] Solicitando permisos de micrófono...');
    audioStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});

    audioContext=new (window.AudioContext||window.webkitAudioContext)();

  } catch(e){

}

function startRecording(){
   console.log('[Grabación] Intento de iniciar grabación. Estado actual -> isRecording:', isRecording, 'isProcessing:', isProcessing, 'hasAudioStream:', !!audioStream);
  if(isRecording||isProcessing||!audioStream) return;
  
  if (audioContext && audioContext.state === 'suspended') {
    console.log('[Mic] AudioContext suspendido. Intentando reactivar...');
    audioContext.resume();
  }

  audioChunks=[]; isRecording=true;
  var mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
  console.log('[Grabación] Usando formato MIME:', mime);
  
  mediaRecorder=new MediaRecorder(audioStream,{mimeType:mime});
  
  mediaRecorder.ondataavailable=function(e){
    if(e.data.size>0){
      audioChunks.push(e.data);
      console.log('[Grabación] Chunk recibido. Tamaño:', e.data.size, 'bytes. Total chunks:', audioChunks.length);
    } else {
      console.warn('[Grabación] Chunk recibido pero está VACÍO (0 bytes)');
    }
  };
  
  mediaRecorder.onstop=onRecordingStop;
  mediaRecorder.start();
  setHUD('rec','Grabando...');
  var btn=document.getElementById('mic-btn'); if(btn)btn.classList.add('recording');
  
  setTimeout(function(){
    if(isRecording){
      console.log('[Grabación] Límite de 25 segundos alcanzado. Forzando parada.');
      stopRecording();
    }
  },25000);
}

function stopRecording(){
   console.log('[Grabación] stopRecording invocado. ¿Registrando?:', isRecording);
  if(!isRecording||!mediaRecorder)return;
  isRecording=false;
  if(silenceTimer){
    console.log('[Grabación] Limpiando temporizador de silencio.');
    cancelAnimationFrame(silenceTimer);
    silenceTimer=null;
  }
  mediaRecorder.stop();
  var btn=document.getElementById('mic-btn');if(btn)btn.classList.remove('recording');
  setHUD('thinking','Procesando...');
}

function startSilenceDetection(){
  var data=new Uint8Array(analyser.frequencyBinCount),silenceMs=0,lastTime=performance.now();
  console.log('[Silencio] Detección iniciada. Umbral (SILENCE_THRESHOLD):', typeof SILENCE_THRESHOLD !== 'undefined' ? SILENCE_THRESHOLD : 'No definido');
  
  function check(){
    if(!isRecording) return;
    analyser.getByteFrequencyData(data);
    var avg=data.reduce(function(a,b){return a+b;},0)/data.length;
    var now=performance.now(),dt=now-lastTime; lastTime=now;
    
    // console.log('[Silencio] Volumen promedio actual:', avg);
    
    if(avg<SILENCE_THRESHOLD){
      silenceMs+=dt;
      if(silenceMs>=SILENCE_DURATION){
        console.log(`[Silencio] Silencio detectado por ${silenceMs}ms (Límite: ${SILENCE_DURATION}ms). Deteniendo grabación automáticamente.`);
        stopRecording();
        return;
      }
    } else {
      if(silenceMs > 0) console.log('[Silencio] Ruido detectado, reseteando contador de silencio. Volumen:', avg);
      silenceMs=0;
    }
    silenceTimer=requestAnimationFrame(check);
  }
  check();
}

async function onRecordingStop(){
  console.log('[Grabación] MediaRecorder se ha detenido. Armando el Blob...');
  var blob=new Blob(audioChunks,{type:'audio/webm'});
  // console.log('[Grabación] Archivo de audio generado -> Tamaño total:', blob.size, 'bytes');
  
  if(blob.size<800){
    console.error('[Grabación] El archivo de audio es DEMASIADO PEQUEÑO (menor a 800 bytes). Se cancela el envío.');
    setHUD('ready','No te escuche, intenta de nuevo');
    return;
  }
  
  isProcessing=true;
  try{
    // console.log('[Whisper] Enviando audio a transcribir...');
    var text=await transcribeAudio(blob);
    // console.log('[Whisper] Respuesta cruda recibida de la función transcribir:', text);
    
    if(!text||text.trim().length<2){
      console.warn('[Whisper] La transcripción regresó vacía o demasiado corta.');
      setHUD('ready','No entendi, intenta de nuevo');
      isProcessing=false;
      return;
    }
    
    console.log('[Whisper] Transcripción exitosa:', text);
    if(appState.screen==='practice') setDialog('TU',text);
    setHUD('thinking','Pensando...');
    
    // console.log('[VR] Ejecutando handleVRSpeech con el texto...');
    await handleVRSpeech(text);
  } catch(e){
    console.error('[Voice] Error crítico en el flujo de parada/transcripción:', e);
    setHUD('ready','Error, intenta de nuevo');
  } finally {
    isProcessing=false;
    // console.log('[Grabación] Ciclo finalizado. Listo para la siguiente instrucción.');
  }
}

async function transcribeAudio(blob) {
  var form = new FormData();
  form.append('file', blob, 'rec.webm');

  // console.log('[Frontend] Enviando audio a nuestro backend seguro...');
  try {
    var res = await fetch('/api/transcribe', {
      method: 'POST',
      body: form // 👈 ¡ASEGÚRATE DE QUE ESTA LÍNEA ESTÉ AQUÍ!
    });

    console.log('[Frontend] Status Code de la API:', res.status);
    var data = await res.status === 200 ? await res.json() : await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data.error || 'Error desconocido en el servidor');
    }

    return data.text || '';
  } catch (fetchError) {
    console.error('[Frontend] Error de conexión o procesamiento:', fetchError);
    throw fetchError;
  }
}

function setupControllers(){
  var scene=document.querySelector('a-scene');
  console.log('[VR Controles] Inicializando controladores VR...');
  
  // Mano Derecha
  var rc=document.createElement('a-entity');
  rc.setAttribute('oculus-touch-controls','hand:right');
  rc.setAttribute('raycaster','objects: .clickable; far:6; showLine:true; lineColor:#00e5c0; lineOpacity:0.7');
  scene.appendChild(rc);
  
  // Mano Izquierda
  var lc=document.createElement('a-entity');
  lc.setAttribute('oculus-touch-controls','hand:left');
  lc.setAttribute('raycaster','objects: .clickable; far:6; showLine:true; lineColor:#9d5cff; lineOpacity:0.5');
  scene.appendChild(lc);
  
  [rc,lc].forEach(function(ctrl){
    ctrl.addEventListener('triggerdown',function(){
      // console.log('[VR Controles] Trigger presionado en:', ctrl.getAttribute('oculus-touch-controls'));
      var hit=ctrl.components&&ctrl.components.raycaster&&ctrl.components.raycaster.intersectedEls&&ctrl.components.raycaster.intersectedEls[0];
      
      if(hit){
        if (hit.object3D && hit.object3D.visible === false) {
          // console.log("🔒 Clic fantasma bloqueado en elemento oculto:", hit.id);
          return; 
        }
        // console.log('[VR Controles] Clic ejecutado en elemento objetivo:', hit.id || hit.tagName);
        hit.click();
        return;
      }
      
      // console.log('[VR Controles] Trigger al aire. ¿Pantalla actual es practice?:', appState.screen);
      if(appState.screen==='practice'){
        if(!isRecording&&!isProcessing) {
          // console.log('[VR Controles] Iniciando grabación vía Trigger.');
          startRecording();
        }
        else if(isRecording) {
          // console.log('[VR Controles] Deteniendo grabación vía Trigger.');
          stopRecording();
        }
      }
    });
  });
  
  
  rc.addEventListener('abuttondown',function(){
    // console.log('[VR Controles] Botón A presionado en mano derecha.');
    if(appState.screen==='practice'){
      if(!isRecording&&!isProcessing) startRecording();
      else if(isRecording) stopRecording();
    }
  });
}

function initActiveListeningConversation() {

  const ajolin = document.getElementById('activity-ajolin');

function avanzarConversacionActiva() {
  const juan = document.getElementById('activity-juan');
  const ajolin = document.getElementById('activity-ajolin');
  const speaker = document.getElementById('speaker-name');
  
  if (activeListeningStep === 0) {
    // Cambiamos el turno a Ajolin (Derecha)
    if (juan) juan.setAttribute('visible', 'false');
    if (ajolin) ajolin.setAttribute('visible', 'true');
    
    if (speaker) {

      speaker.setAttribute('position', '0.7 0.73 0.02'); // Lo movemos un poco a la derecha
    }

    // Si vuelven a dar Next, reinicia el ciclo (o puedes añadir más pasos si lo requieres)
    initActiveListeningConversation();
  }
}

function showNextConversation() {
  const stage = document.querySelector("#vr-preview-stage");
  stage.innerHTML = "";

  const nextBtn = document.querySelector("#btn-next-conversation");
  const nextBtnText = nextBtn ? nextBtn.querySelector('a-text') : null;

  // --- LÓGICA DE CONTROL DE FLUJO SECUENCIAL ---

  // 1. Si terminamos los diálogos de la conversación MALA
  if (currentSimulationPhase === 'bad' && currentMessageIndex >= currentConversation.length) {
    currentSimulationPhase = 'insight_bad';
    
    // Inyectar visualmente el primer Insight en el escenario
    renderInsightText(stage, currentTechniqueData.bad.insight);

    // Cambiar el texto del botón Next
    if (nextBtnText) nextBtnText.setAttribute('value', 'See it done right →');
    return;
  }

  // 2. Si el usuario hace click estando en el Insight de la mala -> Pasar a la BUENA
  if (currentSimulationPhase === 'insight_bad') {
    currentSimulationPhase = 'good';
    currentConversation = currentTechniqueData.good.exchanges; // Cargamos la conversación "good"
    currentMessageIndex = 0;
    
    // Restaurar texto del botón original
    if (nextBtnText) nextBtnText.setAttribute('value', '▶ Next');
  }

  // 3. Si terminamos los diálogos de la conversación BUENA
  if (currentSimulationPhase === 'good' && currentMessageIndex >= currentConversation.length) {
    currentSimulationPhase = 'insight_good';

    // Inyectar visualmente el segundo Insight en el escenario
    renderInsightText(stage, currentTechniqueData.good.insight);

    // Desaparecer botón Next e iluminar el botón definitivo "See the moves"
    if (nextBtn) nextBtn.setAttribute("visible", false);
    
    const toggleBtn = document.querySelector("#btn-toggle-active-listening");
    if (toggleBtn) {
      toggleBtn.setAttribute("visible", true);
      const toggleText = toggleBtn.querySelector('a-text');
      if (toggleText) toggleText.setAttribute('value', 'See the moves');
    }
    return;
  }

  // --- RENDERIZADO REGULAR DE DIÁLOGOS (Turnos normales) ---
  const msg = currentConversation[currentMessageIndex];

  const speakerName =
    msg.speaker === "A"
      ? currentTechniqueData.roleA
      : "Agent";

  const bubbleColor =
    msg.speaker === "A"
      ? "#00adb5"
      : "#ffb347";

  const entity = document.createElement("a-entity");
  entity.setAttribute("position", "0 0.2 0");
  entity.setAttribute("text", {
    value: `${speakerName}: ${msg.text}`,
    align: "center",
    width: 3.2,
    wrapCount: 30,
    color: bubbleColor
  });

  stage.appendChild(entity);
  currentMessageIndex++;
}

// Función auxiliar para pintar los Insights de manera limpia y uniforme
function renderInsightText(stage, textContent) {
  const entity = document.createElement("a-entity");
  entity.setAttribute("position", "0 0.2 0");
  entity.setAttribute("text", {
    value: `INSIGHT:\n${textContent}`,
    align: "center",
    width: 3.2,
    wrapCount: 30,
    color: "#ffedd5" // Color distinguible y cálido para las reflexiones
  });
  stage.appendChild(entity);
}
