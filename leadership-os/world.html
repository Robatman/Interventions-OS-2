<script>  
AFRAME.registerComponent('handler-botones-vr', {
  schema: {
    mensaje: {type: 'string', default: 'Botón presionado'},
    tecnica: {type: 'string', default: 'generica'}
  },
  
  init: function () {
    var el = this.el;
    var data = this.data;

    el.addEventListener('click', function (evt) {
      // 🔒 Validamos que el botón pertenezca a una jerarquía completamente visible y con escala real
      if (el.object3D) {
        let current = el.object3D;
        let isHierarchyActive = true;
        
        while (current) {
          if (current.visible === false || current.scale.x === 0) {
            isHierarchyActive = false;
            break;
          }
          current = current.parent;
        }

        if (!isHierarchyActive) {
          return; // Detiene por completo la ejecución si la pantalla está inactiva
        }
      }

      if (evt.detail && evt.detail.sourceEvent) {
        evt.detail.sourceEvent.stopPropagation();
        evt.detail.sourceEvent.preventDefault();
      }
      evt.stopPropagation(); 
      
      //console.log(`🎯 [VR Click] ${data.mensaje} (ID: ${el.id el.parentElement.id})`);
      ejecutarFuncionPorTecnica(data.tecnica);
    });
  }
});



// ═══ Director de audio ═══
// Un solo audio a la vez. Al cambiar de pantalla o pedir otro audio, el anterior se corta,
// y cualquier audio que llegue tarde (la red tardó) se descarta.
var _voice = { seq: 0, audio: null };

function stopVoice() {
  _voice.seq++;
  if (_voice.audio) { try { _voice.audio.pause(); } catch (e) {} _voice.audio = null; }
  try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
}

// Qué se dice según lo que elige el staff. Más adelante cada clave puede apuntar a un audio pregrabado.
var VOICE_LINES = {
  welcome: function () {
    var gameId = ''; try { gameId = localStorage.getItem('ldr_game_id') || ''; } catch (e) {}
    var name = gameId.split('.')[1];
    return 'Welcome' + (name && name !== 'VISOR' ? ' ' + name : '') + '. I am Juanjolote. ' +
      'Choose a path: Interventions, to practice real check-in conversations, or Techniques, to build the skills to run them well.';
  },
  interventions: 'These are the check-ins that help you spot attrition early. Pick the one you want to practice.',
  techniques: 'These are your tools. Pick one and I will show you a quick before and after example.'
};

function sayLine(key) {
  var t = VOICE_LINES[key];
  if (typeof t === 'function') t = t();
  if (t) speakVR(t, 'daniel');
}

// Frase al ENTRAR a ciertas pantallas (la de bienvenida se dice al pulsar START, no al cargar)
var SCREEN_INTRO_LINES = { 'screen-interventions': 'interventions', 'screen-technique-list': 'techniques' };

/* Shared target selector for the gaze cursor and both VR controller lasers. */
var VR_RAYCAST_OBJECTS = '.clickable, .sub-tecnica';

function refreshAllRaycasters() {
  var raycasters = document.querySelectorAll('[raycaster]');
  for (var i = 0; i < raycasters.length; i++) {
    var comp = raycasters[i].components && raycasters[i].components.raycaster;
    // comp.data aún no existe si el rayo se acaba de crear (evita el TypeError 'objects')
    if (comp && comp.data && typeof comp.refreshObjects === 'function') {
      comp.refreshObjects();
    }
  }
}


function cambiarPantallaVR(pantallaMostrarId) {
  stopVoice();   // lo que se estaba diciendo ya no aplica a la pantalla nueva
  if (typeof setHUD === 'function' && typeof isRecording !== 'undefined' && !isRecording && !isProcessing) setHUD('ready', 'Ready to speak');
  // console.log(`🎬 [DEBUG-PANTALLAS] Cambiando a la pantalla: ${pantallaMostrarId}`);
const entornoUniversal = document.getElementById('entorno-universal');
  if (entornoUniversal) {
    if (pantallaMostrarId === 'screen-intro') {
      entornoUniversal.setAttribute('visible', 'false');
    } else {
      entornoUniversal.setAttribute('visible', 'true');
    }
  }
  const pantallas = [
    'screen-intro',
    'screen-welcome', 
    'screen-mode', 
    'screen-interventions-list', 
    'screen-technique-list',
    'screen-interventions', 

    'screen-learn-work-practice', 
    'screen-history',
    'screen-practice',              
    'screen-eval',                   
    'screen-active-listening-activity',
    'screen-level-selector',
    'screen-intervention-briefing'
  ];
  
  pantallas.forEach(id => {
    const elPantalla = document.getElementById(id);
    if (!elPantalla) return;

    if (id === pantallaMostrarId) {
      elPantalla.setAttribute('visible', 'true');
      elPantalla.setAttribute('scale', '1 1 1');
      
      if (id === 'screen-active-listening-activity') {
        const btnToggle = document.getElementById('btn-toggle-active-listening');
        if (btnToggle) {
          btnToggle.setAttribute('visible', 'true');
          btnToggle.classList.add('clickable'); 
        }
        if (typeof initActiveListeningConversation === 'function') {
          initActiveListeningConversation();
        }
      }
    } else {
      elPantalla.setAttribute('visible', 'false');
      elPantalla.setAttribute('scale', '0 0 0');
      
      if (pantallaMostrarId !== 'screen-active-listening-activity') {
        const btnToggle = document.getElementById('btn-toggle-active-listening');
        if (btnToggle) {
          btnToggle.classList.remove('clickable');
        }
      }
    }
  });

  // 🔍 LOGS PARA EL BOTÓN DE REPETIR FLUJO
// 🔍 LOGS PARA EL BOTÓN DE REPETIR FLUJO
  const btnBackPrev = document.getElementById('btn-back-activity-previous');
  if (btnBackPrev) {
    // console.log("🎯 [DEBUG-FLUJO] Evaluando botón 'Back to previous activity'...");
    
    // AUTO-ACTIVACIÓN: Si entramos a screen-welcome y tenemos los datos listos, lo activamos automáticamente aquí
    if (pantallaMostrarId === 'screen-welcome' && appState.flujoReciente) {
      if (appState.flujoReciente.tecnicaSeleccionada && appState.flujoReciente.modoSeleccionado) {
        appState.flujoReciente.activo = true;
        // console.log("🚀 [DEBUG-FLUJO] ¡Auto-activación exitosa! Se detectó regreso a welcome con datos listos. (.activo = true)");
      }
    }

    // console.log(`   - ¿Pantalla es screen-welcome?: ${pantallaMostrarId === 'screen-welcome'}`);
    // console.log(`   - ¿Existe appState.flujoReciente?: ${!!appState.flujoReciente}`);
    if (appState.flujoReciente) {
      // console.log(`   - ¿Flujo está activo?: ${appState.flujoReciente.activo}`);
      // console.log("   - Datos del flujo actual:", JSON.parse(JSON.stringify(appState.flujoReciente)));
    }

    if (pantallaMostrarId === 'screen-welcome' && appState.flujoReciente && appState.flujoReciente.activo) {
      // console.log("✅ [DEBUG-FLUJO] Mostrando y habilitando el botón de repetir actividad!");
      btnBackPrev.setAttribute('visible', 'true');
      btnBackPrev.setAttribute('scale', '1 1 1');
      btnBackPrev.classList.add('clickable');
    } else {
      // console.log("❌ [DEBUG-FLUJO] Ocultando el botón de repetir actividad (No cumple condiciones).");
      btnBackPrev.setAttribute('visible', 'false');
      btnBackPrev.setAttribute('scale', '0 0 0');
      btnBackPrev.classList.remove('clickable');
    }
  } else {
    console.warn("⚠️ [DEBUG-FLUJO] ERROR: ¡No se encontró el elemento HTML #btn-back-activity-previous!");
  }

  // Refresca mirada + ambos mandos VR por igual (antes solo se refrescaba el
  // primer raycaster de la escena, es decir, únicamente el cursor de mirada).
  refreshAllRaycasters();

  var introKey = SCREEN_INTRO_LINES[pantallaMostrarId];
  if (introKey) sayLine(introKey);
}

function mostrarBriefingIntervencion() {
  console.log("=== 🔍 INICIO DEPURACIÓN BRIEFING ===");
  
  // 1. Obtener técnica y nivel actual
  const tecnica = appState.tecnicaSeleccionada; 
  const nivel = appState.flujoReciente?.nivelSeleccionado || appState.currentLevel || 'mid';
  
  console.log("1. Estado actual:", { 
    tecnicaSeleccionada: tecnica, 
    nivelSeleccionado: nivel,
    flujoReciente: appState.flujoReciente 
  });

  let dataIntervencion = null;
  if (window.INTERVENTIONS) {
    const claveLimpia = tecnica ? tecnica.replace('interv_', '') : '';
    dataIntervencion = window.INTERVENTIONS[tecnica] || 
                       window.INTERVENTIONS[claveLimpia] || 
                       window.INTERVENTIONS['pulse_check'] ||
                       window.INTERVENTIONS['anchoring'];
  }

  console.log("2. Objeto de intervención encontrado:", dataIntervencion);

  // Referencias DOM / A-Frame
  const titleEl = document.getElementById('briefing-title');
  const trapEl = document.getElementById('briefing-trap');
  const tagsEl = document.getElementById('briefing-tags');

  if (dataIntervencion) {
    // 3. Título y Trap
    if (titleEl) {
      const titulo = (dataIntervencion.label || dataIntervencion.title || dataIntervencion.name || tecnica || 'BRIEFING').toUpperCase();
      titleEl.setAttribute('value', `${titulo}`);
    }

    if (trapEl) {
      const trapText = dataIntervencion.trap || dataIntervencion.warning || 'Evita caer en sesgos durante la sesión.';
      trapEl.setAttribute('value', `TRAP: ${trapText}`);
    }

    // 4. UN solo caso (agente + escenario) para briefing Y práctica.
    //    Antes se mostraba siempre scenarios[nivel][0] y la práctica sorteaba otro agente.
    const caso = CaseEngine.build({ interventionId: dataIntervencion.id, level: nivel });
    appState.caso = caso;
    let scenarioData = caso && caso.mode === 'intervention' ? caso.scenario : null;

    if (!scenarioData && dataIntervencion.scenarios) {
      const arrayNivel = dataIntervencion.scenarios[nivel] ||
                         dataIntervencion.scenarios[nivel === 'mid' ? 'intermediate' : nivel];

      if (Array.isArray(arrayNivel) && arrayNivel.length > 0) {
        scenarioData = arrayNivel[0];
      } else if (typeof arrayNivel === 'object') {
        scenarioData = arrayNivel;
      }
    }

    // Respaldo (fallback) por si en otras intervenciones usa 'levels' o 'scripts'
    if (!scenarioData) {
      const fallbackLevel = dataIntervencion.levels?.[nivel] || dataIntervencion.scripts?.[nivel];
      scenarioData = Array.isArray(fallbackLevel) ? fallbackLevel[0] : fallbackLevel;
    }

    // 5. Extraer texto y tags
    let scriptTexto = null;
    let tagsTexto = '';

    if (scenarioData) {
      scriptTexto = scenarioData.text || scenarioData.script || scenarioData.context || scenarioData.description;
      if (scenarioData.tags) {
    // Resultado:  [Promovida sin ajuste salarial]  [No ha dicho nada]  [Bomba de tiempo potencial]
    tagsTexto = Array.isArray(scenarioData.tags) 
    ? scenarioData.tags.map(t => `[${t}]`).join('  ') 
    : scenarioData.tags;
}
    } else {
      // Fallback final: context u objective raíz de la intervención
      scriptTexto = dataIntervencion.agentContext || dataIntervencion.objective || dataIntervencion.description;
    }

    // 6. Renderizar en la pantalla VR
    if (tagsEl) {
      if (scriptTexto) {
        let textoRenderizado = `Level: ${nivel.toUpperCase()}\n\n`;
        textoRenderizado += `• Scenery: "${scriptTexto}"\n\n`;
        if (tagsTexto) {
          textoRenderizado += `• Tags: ${tagsTexto}`;
        }
        console.log("✅ Renderizando texto en pantalla VR:", textoRenderizado);
        tagsEl.setAttribute('value', textoRenderizado);
      } else {
        console.warn("⚠️ No se encontró texto de script para el nivel:", nivel);
        tagsEl.setAttribute('value', `NIVEL: ${nivel.toUpperCase()}\n\nSin script disponible para este nivel.`);
      }
    }

  } else {
    console.error("❌ ERROR CRÍTICO: No se encontró la intervención en window.INTERVENTIONS.");
  }

  console.log("=== 🔚 FIN DEPURACIÓN BRIEFING ===");

  // Transición a la pantalla de VR briefing
  cambiarPantallaVR('screen-intervention-briefing');
}




function mostrarBriefingTecnica() {
  console.log("=== 🔍 BRIEFING DEBUG START ===");

  // 1. Get current level ('novice', 'mid', 'adv')
  const nivel = appState.flujoReciente?.nivelSeleccionado || appState.currentLevel || 'novice';

  // 2-3. UN solo caso (agente + escenario) para briefing Y práctica
  const caso = CaseEngine.build({ techniqueId: appState.tecnicaSeleccionada, level: nivel });
  if (!caso) {
    console.error("❌ ERROR: No available archetypes found.");
    return;
  }
  appState.caso = caso;

  const arquetipoId = caso.archetype.id;
  const dataArquetipo = caso.archetype;

  // DOM / A-Frame References
  const titleEl = document.getElementById('briefing-title');
  const trapEl = document.getElementById('briefing-trap');
  const tagsEl = document.getElementById('briefing-tags');

  if (dataArquetipo) {
    // A. Title
    if (titleEl) {
      const nombre = (dataArquetipo.name || arquetipoId).toUpperCase();
      titleEl.setAttribute('value', `${nombre} - BRIEFING`);
    }

    // B. Trait Banner (TRAP) in English
    if (trapEl) {
      const traitInfo = dataArquetipo.trait 
        ? `TRAIT: ${dataArquetipo.trait.toUpperCase()} - ${dataArquetipo.traitDesc || ''}`
        : 'Be mindful of biases during the conversation.';
      trapEl.setAttribute('value', traitInfo);
    }

    // C. El escenario ya viene definido en el caso (el mismo que usará la práctica)
    let briefingSeleccionado = caso.scenario && caso.scenario.text ? caso.scenario : null;

    // D. Text & Tags extraction
    let scriptTexto = null;
    let tagsTexto = '';

    if (briefingSeleccionado) {
      scriptTexto = briefingSeleccionado.text;
      
      if (briefingSeleccionado.tags) {
      tagsTexto = Array.isArray(briefingSeleccionado.tags)
        ? briefingSeleccionado.tags.map(t => `[${t}]`).join(' ')
        : briefingSeleccionado.tags;
    }
    } else {
      scriptTexto = dataArquetipo.backstory || dataArquetipo.personality || "No scenario available for this level.";
    }

    // E. Render to A-Frame in English (100% ASCII-safe for fonts)
    if (tagsEl) {
      if (scriptTexto) {
        let textoRenderizado = `LEVEL: ${nivel.toUpperCase()}\n\n`;
        textoRenderizado += `Scenario: "${scriptTexto}"\n\n`;
        if (tagsTexto) {
          textoRenderizado += `Tags: ${tagsTexto}`;
        }
        
        console.log("✅ Rendered in VR:", textoRenderizado);
        tagsEl.setAttribute('value', textoRenderizado);
      }
    }
  }

  console.log("=== 🔚 BRIEFING DEBUG END ===");

  cambiarPantallaVR('screen-intervention-briefing');
}





function ejecutarFuncionPorTecnica(tecnica) {
  // Ensure the flow state object exists to avoid "Cannot set property of undefined" errors
  if (!appState.flujoReciente) {
    appState.flujoReciente = {
      pantallaOrigen: null,      
      tecnicaSeleccionada: null, 
      modoSeleccionado: null,    
      nivelSeleccionado: null,   
      activo: false              
    };
  }

  // console.log(`\n🖱️ [DEBUG-CLICK] Executed ejecutarFuncionPorTecnica with parameter: "${tecnica}"`);
  // console.log("📊 [DEBUG-CLICK] Flow state JUST BEFORE click:", JSON.parse(JSON.stringify(appState.flujoReciente)));

  // === INTERCEPTOR TO RECORD REAL-TIME FLOW ===
  // If the user starts a new flow from the traditional 14-button technique list:
  if (tecnica === 'active-listening' || tecnica === 'powerful-questions' || 
      tecnica === 'motivational-interviewing' || tecnica === 'nonviolent-communication' || 
      tecnica === 'radical-candor' || tecnica === 'crucial-conversations' ||
      tecnica === 'tactical-empathy' || tecnica === 'scarf-model' || 
      tecnica === 'immunity-to-change' || tecnica === 'drama-triangle' ||
      tecnica === 'grow-model' || tecnica === 'strengths-based-coaching' || 
      tecnica === 'growth-mindset' || tecnica === 'solution-focused-coaching') {
    
    appState.flujoReciente.pantallaOrigen = 'screen-technique-list';
    appState.flujoReciente.activo = false; // Activity has not finished yet
    // console.log(`📝 [DEBUG-FLOW] Flow origin detected and saved as: "screen-technique-list". Active flow = false.`);
  }

  // If the user selects an intervention from the other list:
  if (tecnica.startsWith('interv-')) {
    appState.flujoReciente.pantallaOrigen = 'screen-interventions';
    appState.flujoReciente.activo = false; 
    
    // Normalize ID with underscores (e.g., "interv-pulse-check" -> "interv_pulse_check")
    let idFormateado = tecnica.replace(/-/g, '_');
    appState.flujoReciente.tecnicaSeleccionada = idFormateado;
    
    // console.log(`📝 [DEBUG-FLOW] Flow origin detected and saved as: "screen-interventions".`);
    // console.log(`🎯 [DEBUG-FLOW] Auto-registered selected intervention: "${idFormateado}"`);
  }

  // Save selected mode
  if (tecnica === 'learn-intervention') {
    appState.flujoReciente.modoSeleccionado = 'learn';
    console.log("📝 [DEBUG-FLOW] Mode saved in flow: 'learn'");
  }
  if (tecnica === 'work-together-intervention') {
    appState.flujoReciente.modoSeleccionado = 'work';
    // console.log("📝 [DEBUG-FLOW] Mode saved in flow: 'work'");
  }
  if (tecnica === 'practice-intervention') {
    appState.flujoReciente.modoSeleccionado = 'practice';
    // console.log("📝 [DEBUG-FLOW] Mode saved in flow: 'practice'");
  }

  // Save difficulty level
  if (tecnica === 'level-novice') {
    appState.flujoReciente.nivelSeleccionado = 'novice';
    // console.log("📝 [DEBUG-FLOW] Level saved in flow: 'novice'");
  }
  if (tecnica === 'level-intermediate') {
    appState.flujoReciente.nivelSeleccionado = 'mid';
    // console.log("📝 [DEBUG-FLOW] Level saved in flow: 'mid'");
  }
  if (tecnica === 'level-expert') {
    appState.flujoReciente.nivelSeleccionado = 'adv';
    // console.log("📝 [DEBUG-FLOW] Level saved in flow: 'adv'");
  }


  // === MAIN ROUTER / SWITCH SYSTEM ===
  switch(tecnica) {

    case 'start-app':
      cambiarPantallaVR('screen-welcome');
      if (typeof setJuanMood === 'function') setJuanMood('happy');
      sayLine('welcome');
      break;

      
    // === COLUMN 1: GREEN ===
    case 'active-listening': 
      appState.tecnicaSeleccionada = 'active_listening';
      appState.tecnicaCargada = 'active_listening'; 
      appState.flujoReciente.tecnicaSeleccionada = 'active_listening'; // Register
      // console.log("🎯 [DEBUG-FLOW] Registered technique: 'active_listening'");
      selectAndPreviewVR('active_listening'); 
      break;

    case 'powerful-questions': 
      appState.tecnicaSeleccionada = 'powerful_questions'; 
      appState.tecnicaCargada = 'powerful_questions';
      appState.flujoReciente.tecnicaSeleccionada = 'powerful_questions'; // Register
      // console.log("🎯 [DEBUG-FLOW] Registered technique: 'powerful_questions'");
      selectAndPreviewVR('powerful_questions'); 
      break;

    case 'motivational-interviewing': 
      appState.tecnicaSeleccionada = 'motivational_interviewing'; 
      appState.tecnicaCargada = 'motivational_interviewing';
      appState.flujoReciente.tecnicaSeleccionada = 'motivational_interviewing'; // Register
      // console.log("🎯 [DEBUG-FLOW] Registered technique: 'motivational_interviewing'");
      selectAndPreviewVR('motivational_interviewing'); 
      break;

    case 'nonviolent-communication': 
      appState.tecnicaSeleccionada = 'nonviolent_communication'; 
      appState.tecnicaCargada = 'nonviolent_communication';
      appState.flujoReciente.tecnicaSeleccionada = 'nonviolent_communication'; // Register
      // console.log("🎯 [DEBUG-FLOW] Registered technique: 'nonviolent_communication'");
      selectAndPreviewVR('nonviolent_communication'); 
      break;

    case 'radical-candor': 
      appState.tecnicaSeleccionada = 'radical_candor'; 
      appState.tecnicaCargada = 'radical_candor';
      appState.flujoReciente.tecnicaSeleccionada = 'radical_candor'; // Register
      // console.log("🎯 [DEBUG-FLOW] Registered technique: 'radical_candor'");
      selectAndPreviewVR('radical_candor'); 
      break;

    case 'crucial-conversations': 
      appState.tecnicaSeleccionada = 'crucial_conversations'; 
      appState.tecnicaCargada = 'crucial_conversations';
      appState.flujoReciente.tecnicaSeleccionada = 'crucial_conversations'; // Register
      // console.log("🎯 [DEBUG-FLOW] Registered technique: 'crucial_conversations'");
      selectAndPreviewVR('crucial_conversations'); 
      break;

    // === COLUMN 2: PURPLE ===
    case 'tactical-empathy': 
      appState.tecnicaSeleccionada = 'tactical_empathy'; 
      appState.tecnicaCargada = 'tactical_empathy';
      appState.flujoReciente.tecnicaSeleccionada = 'tactical_empathy'; // Register
      // console.log("🎯 [DEBUG-FLOW] Registered technique: 'tactical_empathy'");
      selectAndPreviewVR('tactical_empathy'); 
      break;

    case 'scarf-model': 
      appState.tecnicaSeleccionada = 'scarf_model'; 
      appState.tecnicaCargada = 'scarf_model';
      appState.flujoReciente.tecnicaSeleccionada = 'scarf_model'; // Register
      // console.log("🎯 [DEBUG-FLOW] Registered technique: 'scarf_model'");
      selectAndPreviewVR('scarf_model'); 
      break;

    case 'immunity-to-change': 
      appState.tecnicaSeleccionada = 'immunity_to_change';

    // === INTERVENTIONS CASES ===

    case 'work-together-intervention': 
      appState.ultimaActividad = { tipo: 'work', tecnica: appState.tecnicaSeleccionada };
      goWork(); 
      break;

    case 'practice-intervention': 
      appState.ultimaActividad = { tipo: 'practice', tecnica: appState.tecnicaSeleccionada };
      cambiarPantallaVR('screen-level-selector'); 
      break;

    case 'progress': goHistory(); break;
    case 'close-history': cambiarPantallaVR('screen-welcome'); break;
    case 'back-technicas': cambiarPantallaVR('screen-welcome'); break;

    case 'level-novice':
      appState.currentLevel = 'novice';       
      appState.evaluacionHabilitada = true; 
      // If the technique is an intervention, display intervention briefing
      if (appState.tecnicaSeleccionada.startsWith('interv_')) {

        mostrarBriefingTecnica(); 
      }

    case 'level-intermediate':

        mostrarBriefingTecnica(); 
      }
      break;

    case 'level-expert':

      }
      break;

    case 'start-briefed-practice':
      goPractice();
      break;

    case 'back-to-learn-work': cambiarPantallaVR('screen-learn-work-practice'); break;

    case 'resume-last-activity':
      if (appState.ultimaActividad) {
        appState.tecnicaSeleccionada = appState.ultimaActividad.tecnica;
        if (appState.ultimaActividad.tipo === 'learn') goLearn();
        else if (appState.ultimaActividad.tipo === 'work') goWork();
        else if (appState.ultimaActividad.tipo === 'practice') cambiarPantallaVR('screen-level-selector');
      }
      break;

    // === REPLICATE SAVED FLOW ===
    case 'replay-previous-flow':
      // console.log("🔄 [DEBUG-FLOW] Executing replay-previous-flow interactively...");
      ejecutarFlujoGuardado();
      break;

    // === RESET SESSION / RETURN LOBBY ===
    case 'go-welcome-reset':
      // console.log("🏁 [DEBUG-FLOW] Processing 'go-welcome-reset' to return to lobby.");
      // console.log("📊 [DEBUG-FLOW] Previous flow data accumulated in session:", JSON.parse(JSON.stringify(appState.flujoReciente)));

      }
      cambiarPantallaVR('screen-welcome');
      break;

    default: 
      break;
  }
  
  // console.log("📊 [DEBUG-CLICK] Final flow state AFTER executing technique:", JSON.parse(JSON.stringify(appState.flujoReciente)));
  // console.log("========================================\n");
}

let mostrandoMoves = false;

function toggleListeningMoves() {
  // 🛑 CANDADO DE SEGURIDAD PARA LA BIENVENIDA:
  const welcomeScreen = document.getElementById('screen-welcome');
  if (welcomeScreen && welcomeScreen.getAttribute('visible') === 'true') {
    console.log("🚫 Click bloqueado: No puedes usar este botón mientras estés en la pantalla de bienvenida.");
    return;
  }

  const sessionContent = document.getElementById('listening-session-content');
  const movesContainer = document.getElementById('moves-container');
  const btnText = document.getElementById('text-btn-toggle-listening');
  const btnPlane = document.getElementById('btn-toggle-active-listening');
  
  // Referencias a tus ajolotes
  const juan = document.getElementById('activity-juan');
  const ajolin = document.getElementById('activity-ajolin');

  if (!mostrandoMoves) {
    // 1. Ocultar contenido y mostrar los 4 cartelitos
    if (sessionContent) sessionContent.setAttribute('visible', 'false');
    if (movesContainer) movesContainer.setAttribute('visible', 'true');
    
    // 🛑 OCULTAR LOS AJOLOTES INMEDIATAMENTE

    if (movesContainer) movesContainer.setAttribute('visible', 'false');
    if (btnText) btnText.setAttribute('text', 'value', "See the moves");
    if (btnPlane) btnPlane.setAttribute('color', '#ff5ca0');
    
    // 🔄 RESTAURAR VISIBILIDAD DE LOS AJOLOTES SEGÚN EL TURNO ACTUAL ANTES DE IRNOS
    if (typeof activeListeningStep !== 'undefined') {
      if (activeListeningStep === 0) {
        if (juan) juan.setAttribute('visible', 'true');

        if (juan) juan.setAttribute('visible', 'false');
        if (ajolin) ajolin.setAttribute('visible', 'true');
      }
    }
    
    // Tu redirección original intacta
    if (typeof showScreen === 'function') {
      showScreen('learn-work-practice');
    } else if (typeof cambiarPantallaVR === 'function') {
      // Por si usas la otra función en este script
      // console.log("Aquí 1");
      cambiarPantallaVR('screen-learn-work-practice');

function pickRandomScenario(archetype, level, tecnica) {
  // console.log("--- 🕵️‍♂️ INSIDE pickRandomScenario ---");
  // console.log("📥 Parámetros recibidos -> Nivel:", level, "| Técnica:", tecnica);

  // 1. Obtener pool inicial por nivel
  var pool = archetype.briefings[level] || archetype.briefings['novice'] || [];
  // console.log(`📦 Tamaño del pool inicial para el nivel [${level}]:`, pool.length);

  // Muestra qué técnicas tienen los escenarios de este arquetipo en la consola
  if (pool.length > 0) {
    // console.log("📋 Técnicas disponibles en los escenarios de este nivel:");
    pool.forEach((scen, idx) => {
      // console.log(`   [${idx}] Escenario: "${scen.title || 'Sin Título'}" -> Técnica asignada en objeto:`, scen.tecnica);
    });
  }

  // 2. Filtrar por técnica
  if (tecnica) {
    // console.log(`🎯 Intentando filtrar escenarios para la técnica exacta: "${tecnica}"`);
    
    var poolFiltrado = pool.filter(function(scenario) {
      return scenario.tecnica === tecnica;
    });
    
    // console.log("📊 Tamaño del pool tras aplicar el filtro de técnica:", poolFiltrado.length);
    
    if (poolFiltrado.length > 0) {
      pool = poolFiltrado;
      // console.log("✅ Filtro exitoso. Se usará el pool específico de la técnica.");
    } else {
      // console.warn(`⚠️ Ojo: No se encontró ningún escenario con la propiedad tecnica: "${tecnica}" en este arquetipo. Usando el pool general por defecto.`);
    }
  } else {
    // console.log("ℹ️ No se pasó ninguna técnica a la función. Se elige del pool general de nivel.");
  }

  if (!pool.length) {
    console.error("❌ ERROR: El pool de escenarios está completamente vacío.");
    return null;
  }

  var elegido = pool[Math.floor(Math.random() * pool.length)];
  // console.log("🏆 Escenario seleccionado:", elegido);
  // console.log("------------------------------------");
  return elegido;
}

function showScreen(name) {
  // console.log("🔄 Solicitando cambiar a la pantalla:", name);
  var idReal = name.startsWith('screen-') ? name : 'screen-' + name;
  
    cambiarPantallaVR(idReal);
  const pantallas = [
    'welcome',
    'mode',
    'practice',
    'eval',
    'interventions',
    'techniques',
    'screen-mode',
    'learn-work-practice',
    'active-listening-activity'
  ];

  pantallas.forEach(function(s) {
    var idReal = s.startsWith('screen-') ? s : 'screen-' + s;
    var el = document.getElementById(idReal);
    
    if (el) {
      if (s === name || idReal === name) {
        el.setAttribute('visible', 'true');
        el.setAttribute('scale', '1 1 1');
      } else {
        el.setAttribute('visible', 'false');
        el.setAttribute('scale', '0 0 0');
      }
    }
  });

  appState.screen = name;

  // Technique visibility is managed only by applyTechniquePage(). Other screens
  // already hide their entire hierarchy, so changing raycast classes here would
  // needlessly enable hidden pagination targets.
  if (name === 'technique-list' || name === 'screen-technique-list') {
    applyTechniquePage();
  }
  refreshAllRaycasters();
}

// ─── ENSEÑANZA (Learn / Work Together) ───
// Usa la lógica completa de prompts.js: filosofía de la técnica (p. ej. Leadership and Self-Deception),
// etapas (por qué → qué es → cómo → verificar), apertura propia por técnica e intervención y preguntas guía.

// Deja listas las globales que leen los prompts (currentTechnique, currentIntervention, activeMenu)
function prepareTeachingContext() {
  var sel = String(appState.tecnicaSeleccionada || '');
  if (sel.indexOf('interv_') === 0 && typeof INTERVENTIONS !== 'undefined' && INTERVENTIONS[sel.replace('interv_', '')]) {
    currentIntervention = INTERVENTIONS[sel.replace('interv_', '')];
    appState.activeMenu = 'interventions';
  } else if (typeof TECHNIQUES !== 'undefined' && TECHNIQUES[sel]) {
    currentTechnique = TECHNIQUES[sel];
    currentIntervention = null;
    appState.activeMenu = 'techniques';
  }
  window.activeMenu = appState.activeMenu;
}

// La primera frase de Juanjolote: una pregunta propia de cada técnica o intervención (no una clase)
function teachingOpener() {
  prepareTeachingContext();
  var p = appState.activeMenu === 'interventions' ? PROMPTS.learnIntervention() : PROMPTS.learn();
  var m = p.match(/OPENING MESSAGE \(use this EXACTLY[^)]*\):\n([\s\S]+?)(?:\n\nRespond|\n\nMax|$)/);
  if (m) return m[1].trim();
  var label = appState.activeMenu === 'interventions' ? (currentIntervention && currentIntervention.label) : (currentTechnique && currentTechnique.label);
  return 'Tell me, where does ' + (label || 'this') + ' show up as a real challenge for you?';

// Avanza la etapa según lo que dice Juanjolote (palabras clave de cada técnica)
function updateLearnStage(reply) {
  if (appState.sessionMode !== 'learn' || appState.activeMenu !== 'techniques') return;
  var t = currentTechnique;
  if (!t || !t.stageKeywords || !t.stages) return;
  var r = String(reply || '').toLowerCase(), st = appState.learnStage || 1;
  [1, 2, 3].forEach(function (k) {
    if ((t.stageKeywords[k] || []).some(function (w) { return r.indexOf(w) >= 0; })) st = Math.max(st, k + 1);
  });
  appState.learnStage = st;
  showLearnStage();
}

async function callGroqLLM(mode) {

  var systemPrompt = '';

  if (mode === 'practice') {

    systemPrompt =
      PROMPTS.avatar(
        appState.currentLevel,
        appState.currentScenario
      ) +
      "\n\nCRITICAL: You must respond strictly and exclusively in natural English. Even if the user speaks or replies in Spanish, you must ONLY reply in English.";

  } else if (mode === 'learn') {

    // La lógica de enseñanza completa de prompts.js: filosofía (p. ej. Leadership and Self-Deception),
    // etapas (por qué → qué es → cómo → verificar), preguntas de apertura propias y práctica con casos reales
    prepareTeachingContext();
    systemPrompt =
      (appState.activeMenu === 'interventions' ? PROMPTS.learnIntervention() : PROMPTS.learn()) +
      "\n\nLANGUAGE: The voice is English-only. Reply strictly in English, even if the manager writes in Spanish (understand it, answer in English).";

  } else if (mode === 'work') {

    prepareTeachingContext();
    systemPrompt =
      PROMPTS.work() +
      "\n\nLANGUAGE: The voice is English-only. Reply strictly in English, even if the manager writes in Spanish (understand it, answer in English).";
  }

  var llmMessages = [
    { role: 'system', content: systemPrompt },
    ...appState.agentHistory.slice(-12)
  ];

  // Práctica: se avisa al agente del tono con el que le hablaron en ESTE turno
  if (mode === 'practice' && typeof CaseEngine !== 'undefined') {
    var hint = CaseEngine.toneHint(appState.lastTone);
    if (hint) llmMessages.push({ role: 'system', content: hint });
  }

  var res = await authFetch('/api/groq', {

    method: 'POST',

    headers: {
      'Content-Type': 'application/json'
    },

    body: JSON.stringify({

      messages: llmMessages,

      max_tokens: mode === 'practice' ? 170 : 230,

      temperature: mode === 'practice' ? 0.88 : 0.7,

      // Evitar razonamiento visible
      reasoning_effort: 'none',

      reasoning_format: 'hidden'
    })
  });

  var data = await res.json();

  if (data.error) {
    console.error('[Groq Error]', data.error);
    var llmErr = new Error(typeof data.error === 'string' ? data.error : (data.error.message || 'Groq API error'));
    llmErr.status = res.status;   // 429 = límite de uso del plan gratuito
    throw llmErr;
  }

  var rawContent =
    data.choices?.[0]?.message?.content || '';

  console.log('[Groq raw response]', rawContent);

  console.log(
    '[Groq finish reason]',
    data.choices?.[0]?.finish_reason
  );

  // Seguridad extra: eliminar bloques <think> si aparecen
  rawContent = rawContent
    .replace(/<think>[\s\S]*?<\/think>/gi, '')
    .trim();

  return rawContent || '...';
}

function parseAgentReply(raw){
  var moodMatch=raw.match(/\[MOOD:(\d+)\]/),boxMatch=raw.match(/\[BOX:(in|out)\]/);
  var msg=raw.replace(/\[MOOD:\d+\]/g,'').replace(/\[BOX:(in|out)\]/g,'').replace(/\[TRIGGER:\w+\]/g,'').replace(/\[CLOSED:(true|false)\]/g,'').trim();
  return {msg:msg,newMood:moodMatch?parseInt(moodMatch[1]):appState.vrMood,boxState:boxMatch?boxMatch[1]:appState.boxState};
}

// Tope de turnos por práctica: una conversación real de seguimiento es corta, y así el gasto por práctica tiene un máximo
var MAX_PRACTICE_TURNS = 10;

async function handleVRSpeech(text) {
  if (!text.trim()) return;
  // sessionMode lo fijan goPractice / goLearn / goWork (antes se adivinaba con currentArchetype, que podía venir de una práctica anterior)
  var sessionMode = appState.sessionMode || (appState.currentArchetype ? 'practice' : 'learn');
  var mode = sessionMode === 'practice' ? 'practice' : 'learn';
  var llmMode = sessionMode === 'practice' ? 'practice' : (sessionMode === 'work' ? 'work' : 'learn');

  if (mode === 'practice') {
    var userTurns = appState.agentHistory.filter(function (m) { return m.role === 'user'; }).length;
    if (userTurns >= MAX_PRACTICE_TURNS) {
      setHUD('ready', 'Practice time is up - press Finish to see your evaluation');
      return;
    }
  }

  appState.agentHistory.push({ role: 'user', content: text });

  // Tono con el que habló el staff: el agente reacciona a CÓMO le hablan, no solo a QUÉ le dicen
  var prevMood = appState.vrMood;
  appState.lastTone = mode === 'practice' && typeof CaseEngine !== 'undefined' ? CaseEngine.tone(text) : 'neutral';

  try {
    var reply = await callGroqLLM(llmMode);
    var parsed = mode === 'practice' ? parseAgentReply(reply) : { msg: reply, newMood: appState.vrMood, boxState: 'out' };
    appState.agentHistory.push({ role: 'assistant', content: reply });

    if (mode === 'practice') {
      // Si le faltaron al respeto, el ánimo baja sí o sí (aunque el modelo se haya quedado corto)
      parsed.newMood = CaseEngine.enforceMood(appState.lastTone, prevMood, parsed.newMood);
      updateVRMood(parsed.newMood);          // también cambia la cara del avatar (enojado, triste, neutral, feliz)
      appState.boxState = parsed.boxState;
      setDialog(appState.currentArchetype.name.toUpperCase(), parsed.msg);
    } else {
      setJuanMood('thinking');
      setDialog('JUANJOLOTE', parsed.msg);
      if (typeof updateLearnStage === 'function') updateLearnStage(parsed.msg);
    }

    speakVR(
      parsed.msg,
      getVoice(mode === 'practice' ? 'agent' : 'juan'),
      function () {
        setHUD('ready', 'Ready to speak');
        if (mode !== 'practice') setJuanMood('neutral');
      }
    );

  } catch (e) {
    console.error('[LLM]', e);
    // El último mensaje del usuario no obtuvo respuesta: se quita para no desajustar el historial
    if (appState.agentHistory.length && appState.agentHistory[appState.agentHistory.length - 1].role === 'user') {
      appState.agentHistory.pop();
    }
    setHUD('ready', e && e.status === 429
      ? 'Free daily limit reached - try again in a few minutes'
      : 'Error, intenta de nuevo');
  }
}

async function goEval() {

  showScreen('eval');

  var evalMoodEl = document.getElementById('eval-mood');

  if (evalMoodEl) {
    evalMoodEl.setAttribute(
      'text',
      'value',
      appState.vrMood + '%'
    );
  }

  setJuanMood('talking');

  // Evaluador que conoce el caso: objetivo de la empresa, técnica, señales reales y lo que el agente sentía
  var evalTechId = (typeof TECHNIQUES !== 'undefined' && TECHNIQUES[appState.tecnicaSeleccionada]) ? appState.tecnicaSeleccionada : null;
  var evalSystem = (appState.caso && typeof PROMPTS.evalVR === 'function')
    ? PROMPTS.evalVR(appState.caso, { techniqueId: evalTechId, level: appState.currentLevel, mood: appState.vrMood })
    : 'You are Juanjolote, a direct and honest coach. Evaluate this practice conversation in English, plain ASCII, max 4 sentences.';

  var transcript = appState.agentHistory.slice(-30).map(function (m) {
    return (m.role === 'user' ? 'SUPERVISOR: ' : 'AGENT: ') + String(m.content || '').replace(/\[[A-Z]+:[^\]]*\]/g, '').slice(0, 300);
  }).join('\n');

  var evalText =
    'TRANSCRIPT (' + appState.agentHistory.length + ' messages, most recent last):\n' + transcript +
    '\n\nEvaluate it now using the exact required format.';

  try {

    var res = await authFetch('/api/groq', {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify({


        messages: [

          {
            role: 'system',

            content: evalSystem
          },

          {
            role: 'user',
            content: evalText
          }
        ],

        max_tokens: 420,

        temperature: 0.7,

        // Evitar razonamiento
        reasoning_effort: 'none',

        reasoning_format: 'hidden'
      })
    });

    var data = await res.json();

    if (data.error) {
      console.error('[Groq Error]', data.error);
      throw new Error(typeof data.error === 'string' ? data.error : (data.error.message || 'Groq API error'));
    }

    var feedback =
      data.choices?.[0]?.message?.content || '';

    console.log('[Groq Eval raw response]', feedback);

    // Por seguridad, quitar <think> si aparece
    feedback = feedback
      .replace(/<think>[\s\S]*?<\/think>/gi, '')
      .trim();

    if (!feedback) {
      feedback = 'Session completed.';
    }

    // Separa lo que se muestra en el panel de lo que Juanjolote dice en voz alta
    var spoken = '';
    var spokenMatch = feedback.match(/SPOKEN:\s*([\s\S]*)$/i);
    if (spokenMatch) {
      spoken = spokenMatch[1].trim();
      feedback = feedback.slice(0, spokenMatch.index).trim() || feedback;
    }

    var feedbackEl =
      document.getElementById('eval-feedback');

    if (feedbackEl) {
      feedbackEl.setAttribute(
        'text',
        'value',
        feedback
      );
    }

    speakVR(
      spoken || feedback.slice(0, 280),
      getVoice('juan')
    );

// Voz gratuita del navegador: se usa cuando la voz de Groq falla o llega a su límite de uso
function speakBrowser(text, done) {
  try {
    if (!('speechSynthesis' in window)) { done(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    var voices = window.speechSynthesis.getVoices() || [];
    var en = voices.filter(function (v) { return /^en[-_]/i.test(v.lang); })[0];
    if (en) u.voice = en;
    u.onend = done;
    u.onerror = done;
    window.speechSynthesis.speak(u);
    // Seguro: si el navegador nunca avisa que terminó, no dejamos la pantalla esperando
    setTimeout(done, Math.min(20000, 1500 + text.length * 90));
  } catch (e) {
    done();
  }
}

async function speakVR(text, voice = "daniel", callback = null) {
  stopVoice();                 // cada audio nuevo corta el anterior
  var mySeq = _voice.seq;
  // 'done' se ejecuta una sola vez, pase lo que pase (así el indicador nunca se queda en "Thinking...")
  var finished = false;
  var done = function () {
    if (finished) return;
    finished = true;
    if (callback) callback();
  };

  text = String(text || '').trim();
  if (!text) { done(); return; }

  // Si la voz de Groq alcanzó su límite hace poco, no se vuelve a intentar durante unos minutos
  if (!appState.ttsPausedUntil || Date.now() > appState.ttsPausedUntil) {
    try {
      var speechResponse = await authFetch('/api/groq_speakvr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'speech', text: text, voice: voice })
      });

      // Si mientras llegaba el audio el staff cambió de pantalla o pidió otro, este ya no se reproduce
      if (mySeq !== _voice.seq) { done(); return; }

      if (speechResponse.ok) {
        var blob = await speechResponse.blob();
        if (mySeq !== _voice.seq) { done(); return; }
        var url = URL.createObjectURL(blob);
        var audio = new Audio(url);
        _voice.audio = audio;
        audio.onended = function () { URL.revokeObjectURL(url); if (_voice.audio === audio) _voice.audio = null; done(); };
        audio.onerror = function () { URL.revokeObjectURL(url); if (mySeq === _voice.seq) speakBrowser(text, done); else done(); };
        await audio.play();
        return;
      }

      console.warn('[TTS] Groq respondió', speechResponse.status, '- usando la voz del navegador');
      if (speechResponse.status === 429) {
        appState.ttsPausedUntil = Date.now() + 10 * 60 * 1000;
        setHUD('ready', 'Voice limit reached - using basic voice');
      }
    } catch (e) {
      console.warn('[TTS] Error de voz, usando la voz del navegador:', e);
    }
  }

  if (mySeq !== _voice.seq) { done(); return; }
  speakBrowser(text, done);
}

async function setupMic(){
  try{
    // console.log('[Mic] Solicitando permisos de micrófono...');
    audioStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    // console.log('[Mic] Permisos concedidos. Stream obtenido:', audioStream.id);
    
    audioContext=new (window.AudioContext||window.webkitAudioContext)();
    // console.log('[Mic] AudioContext estado inicial:', audioContext.state);
    
    analyser=audioContext.createAnalyser();
    analyser.fftSize=2048;
    audioContext.createMediaStreamSource(audioStream).connect(analyser);
    setHUD('ready','Ready to speak');
    // console.log('[Mic] Configuración completa y Analyser conectado.');
  } catch(e){
    setHUD('idle','No microphone - text mode');

}

function startRecording(){
  //  console.log('[Grabación] Intento de iniciar grabación. Estado actual -> isRecording:', isRecording, 'isProcessing:', isProcessing, 'hasAudioStream:', !!audioStream);
  if(isRecording||isProcessing||!audioStream) return;
  
  if (audioContext && audioContext.state === 'suspended') {
    // console.log('[Mic] AudioContext suspendido. Intentando reactivar...');
    audioContext.resume();
  }

  audioChunks=[]; isRecording=true;
  var mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
  console.log('[Grabación] Usando formato MIME:', mime);
  
  mediaRecorder=new MediaRecorder(audioStream,{mimeType:mime});
  
  mediaRecorder.ondataavailable=function(e){
    if(e.data.size>0){
      audioChunks.push(e.data);
      // console.log('[Grabación] Chunk recibido. Tamaño:', e.data.size, 'bytes. Total chunks:', audioChunks.length);
    } else {
      // console.warn('[Grabación] Chunk recibido pero está VACÍO (0 bytes)');
    }
  };
  
  mediaRecorder.onstop=onRecordingStop;
  mediaRecorder.start();
  setHUD('rec','Recording...');
  var btn=document.getElementById('mic-btn'); if(btn)btn.classList.add('recording');
  
  setTimeout(function(){
    if(isRecording){
      // console.log('[Grabación] Límite de 25 segundos alcanzado. Forzando parada.');
      stopRecording();
    }
  },25000);
}

function stopRecording(){
   // console.log('[Grabación] stopRecording invocado. ¿Registrando?:', isRecording);
  if(!isRecording||!mediaRecorder)return;
  isRecording=false;
  if(silenceTimer){
    // console.log('[Grabación] Limpiando temporizador de silencio.');
    cancelAnimationFrame(silenceTimer);
    silenceTimer=null;
  }
  mediaRecorder.stop();
  var btn=document.getElementById('mic-btn');if(btn)btn.classList.remove('recording');
  setHUD('thinking','Processing...');
}

function startSilenceDetection(){
  var data=new Uint8Array(analyser.frequencyBinCount),silenceMs=0,lastTime=performance.now();
  // console.log('[Silencio] Detección iniciada. Umbral (SILENCE_THRESHOLD):', typeof SILENCE_THRESHOLD !== 'undefined' ? SILENCE_THRESHOLD : 'No definido');
  
  function check(){
    if(!isRecording) return;
    analyser.getByteFrequencyData(data);
    var avg=data.reduce(function(a,b){return a+b;},0)/data.length;
    var now=performance.now(),dt=now-lastTime; lastTime=now;
    
    // console.log('[Silencio] Volumen promedio actual:', avg);
    
    if(avg<SILENCE_THRESHOLD){
      silenceMs+=dt;
      if(silenceMs>=SILENCE_DURATION){
        console.log(`[Silencio] Silencio detectado por ${silenceMs}ms (Límite: ${SILENCE_DURATION}ms). Deteniendo grabación automáticamente.`);
        stopRecording();
        return;
      }
    } else {
      if(silenceMs > 0) console.log('[Silencio] Ruido detectado, reseteando contador de silencio. Volumen:', avg);
      silenceMs=0;
    }
    silenceTimer=requestAnimationFrame(check);
  }
  check();
}

async function onRecordingStop(){
  // console.log('[Recording] MediaRecorder has stopped. Assembling Blob...');
  var blob = new Blob(audioChunks, { type: 'audio/webm' });
  // console.log('[Recording] Generated audio file -> Total size:', blob.size, 'bytes');
  
  if (blob.size < 800) {
    // console.error('[Recording] The audio file is TOO SMALL (under 800 bytes). Canceling upload.');
    setHUD('ready', "I didn't hear you, please try again");
    return;
  }
  
  isProcessing = true;
  try {
    // console.log('[Whisper] Sending audio to transcribe...');
    var text = await transcribeAudio(blob);
    // console.log('[Whisper] Raw response received from transcription function:', text);
    
    if (!text || text.trim().length < 2) {
      console.warn('[Whisper] Transcription returned empty or too short.');
      setHUD('ready', "I didn't understand, please try again");
      isProcessing = false;
      return;
    }
    
    console.log('[Whisper] Transcription successful:', text);
    if (appState.screen === 'practice') setDialog('YOU', text);
    setHUD('thinking', 'Thinking...');
    
    // console.log('[VR] Executing handleVRSpeech with the text...');
    await handleVRSpeech(text);
  } catch(e) {
    console.error('[Voice] Critical error in the stop/transcription flow:', e);
    setHUD('ready', 'Error, please try again');
  } finally {
    isProcessing = false;
    // console.log('[Recording] Cycle finished. Ready for the next instruction.');
  }
}


async function transcribeAudio(blob) {
  var form = new FormData();
  form.append('file', blob, 'rec.webm');

  // console.log('[Frontend] Enviando audio a nuestro backend seguro...');
  try {
    var res = await authFetch('/api/transcribe', {
      method: 'POST',
      body: form // 👈 ¡ASEGÚRATE DE QUE ESTA LÍNEA ESTÉ AQUÍ!
    });

    console.log('[Frontend] Status Code de la API:', res.status);
    var data = await res.status === 200 ? await res.json() : await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data.error || 'Error desconocido en el servidor');
    }

    return data.text || '';
  } catch (fetchError) {
    console.error('[Frontend] Error de conexión o procesamiento:', fetchError);
    throw fetchError;
  }
}

// Variable global para controlar el paso actual de la conversación
let activeListeningStep = 0;

function initActiveListeningConversation() {
  activeListeningStep = 0;
  
  const juan = document.getElementById('activity-juan');
  const ajolin = document.getElementById('activity-ajolin');
  const speaker = document.getElementById('speaker-name');
  
  // 🔒 CANDADOS DE LOS AXOLOTL (sólo presentación; no tocan el flujo ni el estado):
  // 1) ANTI-FLOTACIÓN: los dos axolotl son estáticos (sin bob/drift) → se quita
  //    cualquier 'animation' o 'animation__*' que pudiera añadirse en runtime.
  // 2) COORDENADAS COMPARTIDAS: Ajolín copia la position exacta de Juan
  //    (-2.38 0.20 0.05) → el cambio de hablante no salta ni se desplaza.
  [juan, ajolin].forEach(function (el) {
    if (!el) return;
    Object.keys(el.components || {}).forEach(function (name) {
      if (name === 'animation' || name.indexOf('animation__') === 0) el.removeAttribute(name);
    });
  });
  if (juan && ajolin) {
    const sharedPos = juan.getAttribute('position');
    if (sharedPos && typeof sharedPos.x === 'number') {
      ajolin.setAttribute('position', {x: sharedPos.x, y: sharedPos.y, z: sharedPos.z});
    }
  }

  // Juanjolote inicia visible: el único cambio de turno es 'visible' (sin motion)
  if (juan) juan.setAttribute('visible', 'true');
  if (ajolin) ajolin.setAttribute('visible', 'false');
  
  if (speaker) {
    speaker.setAttribute('value', ' ');
    speaker.setAttribute('color', '#00e5c0'); // Color cian de Juanjolote
    speaker.setAttribute('position', '0 -0.55 0.02'); // Alineado a la izquierda
  }
}

function avanzarConversacionActiva() {
  const juan = document.getElementById('activity-juan');
  const ajolin = document.getElementById('activity-ajolin');
  const speaker = document.getElementById('speaker-name');
  
  if (activeListeningStep === 0) {
    // Cambiamos el turno a Ajolin: sólo alterna 'visible' (la position es la MISMA)
    if (juan) juan.setAttribute('visible', 'false');
    if (ajolin) ajolin.setAttribute('visible', 'true');

      speaker.setAttribute('value', ' ');

      speaker.setAttribute('position', '0 -0.55 0.02'); // Coordenada fija para ambos (sin desplazar)
    }

  } else {
    // Si vuelven a dar Next, reinicia el ciclo (o puedes añadir más pasos si lo requieres)
    initActiveListeningConversation();
  }
}

function showNextConversation() {
  const stage = document.querySelector("#vr-preview-stage");
  stage.innerHTML = "";

  const nextBtn = document.querySelector("#btn-next-conversation");
  const nextBtnText = nextBtn ? nextBtn.querySelector('a-text') : null;
  
  // Referencias a los personajes y etiquetas
  const juan = document.getElementById('activity-juan');
  const ajolin = document.getElementById('activity-ajolin');
  const speakerLabel = document.getElementById('speaker-name');

  // --- LÓGICA DE CONTROL DE FLUJO SECUENCIAL ---

  // 1. Si terminamos los diálogos de la conversación MALA
  if (currentSimulationPhase === 'bad' && currentMessageIndex >= currentConversation.length) {
    currentSimulationPhase = 'insight_bad';
    
    // Inyectar visualmente el primer Insight en el escenario
    renderInsightText(stage, currentTechniqueData.bad.insight);

    // CONTROL DE AJOLOTES EN INSIGHT: Lo narra Juanjolote (Coach)
    if (juan) juan.setAttribute('visible', 'true');
    if (ajolin) ajolin.setAttribute('visible', 'false');
    
    if (speakerLabel) {
      speakerLabel.setAttribute('value', '(INSIGHT)');
      speakerLabel.setAttribute('align', 'center');          // 🎯 Centrado
      speakerLabel.setAttribute('position', '0 -0.55 0.02');  // 🎯 Bien abajo, libre del botón
    }

    // Cambiar el texto del botón Next
    if (nextBtnText) nextBtnText.setAttribute('value', 'See it done right →');
    return;
  }

  // 2. Si el usuario hace click estando en el Insight de la mala -> Pasar a la BUENA
  if (currentSimulationPhase === 'insight_bad') {
    currentSimulationPhase = 'good';
    currentConversation = currentTechniqueData.good.exchanges; // Cargamos la conversación "good"
    currentMessageIndex = 0;
    
    // Restaurar texto del botón original
    if (nextBtnText) nextBtnText.setAttribute('value', '▶ Next');
  }

  // 3. Si terminamos los diálogos de la conversación BUENA
  if (currentSimulationPhase === 'good' && currentMessageIndex >= currentConversation.length) {
    currentSimulationPhase = 'insight_good';

    // Inyectar visualmente el segundo Insight en el escenario
    renderInsightText(stage, currentTechniqueData.good.insight);

    // CONTROL DE AJOLOTES EN INSIGHT: Lo narra Juanjolote (Coach)
    if (juan) juan.setAttribute('visible', 'true');
    if (ajolin) ajolin.setAttribute('visible', 'false');
    
    if (speakerLabel) {
      speakerLabel.setAttribute('value', '(INSIGHT)');
      speakerLabel.setAttribute('align', 'center');          // 🎯 Centrado
      speakerLabel.setAttribute('position', '0 -0.55 0.02');  // 🎯 Bien abajo, libre del botón
    }

    // Desaparecer botón Next e iluminar el botón definitivo "See the moves"
    if (nextBtn) {
      nextBtn.setAttribute("visible", false);
      nextBtn.classList.remove("clickable"); 
    }
    
    const toggleBtn = document.querySelector("#btn-toggle-active-listening");
    if (toggleBtn) {
      toggleBtn.setAttribute("visible", true);
      toggleBtn.classList.add("clickable"); 
      const toggleText = toggleBtn.querySelector('a-text');
      if (toggleText) toggleText.setAttribute('value', 'See the moves');
    }

    // Forzar a TODOS los raycasters a actualizarse (mirada + mandos VR)
    refreshAllRaycasters();
    return;
  }

  // --- RENDERIZADO REGULAR DE DIÁLOGOS (Turnos normales) ---
  const msg = currentConversation[currentMessageIndex];

  let speakerName = "";

  // 🎯 ASIGNACIÓN ESTRICTA BASADA EN EL SPEAKER DEL ARCHIVO PREVIEW.JS
  if (msg.speaker === "A") {
    // Turno de Juanjolote (Coach)
    speakerName = currentTechniqueData.roleA || "Coach";

    if (juan) juan.setAttribute('visible', 'true');
    if (ajolin) ajolin.setAttribute('visible', 'false');
  } else {
    // Turno de Ajolín (Agent)
    speakerName = "Agent";

    if (juan) juan.setAttribute('visible', 'false');
    if (ajolin) ajolin.setAttribute('visible', 'true');
  }

  // 🎯 CONFIGURAMOS EL NOMBRE ABAJO Y AL CENTRO SIEMPRE
  if (speakerLabel) {
    speakerLabel.setAttribute('value', speakerName.toUpperCase());
    speakerLabel.setAttribute('align', 'center');          // 🎯 Asegura que el texto se alinee al centro
    speakerLabel.setAttribute('position', '0 -0.55 0.02');  // 🎯 Coordenada fija bajo el cuadro para ambos
  }

  // Imprimir el diálogo en el panel VR
  // Tamaño de fuente = 2 * width / wrapCount = 2*2.9/34 ≈ 0.171 → ≤4 líneas ≈ 0.68 de
  // alto y 2.9 de ancho (los diálogos más largos son ~88 chars + el nombre → 3-4 líneas):
  // queda holgado dentro del globo visible de CuadroTexto.png (4.41 de ancho × 1.00 de
  // alto, centro y 0.435) con ~0.65 de margen lateral y ~0.16 arriba/abajo. El texto va
  // a y absoluta 0.442 (stage 0.422 + 0.02): 0.007 por encima del centro del globo, el
  // mismo desvío mínimo que ya tenía el diseño original (0.50 vs 0.493).
  const entity = document.createElement("a-entity");
  entity.setAttribute("position", "0 0.02 0");
  entity.setAttribute("text", {
    value: `${speakerName}: ${msg.text}`,
    align: "center",
    width: 2.4,
    wrapCount: 30
  });

  stage.appendChild(entity);
  currentMessageIndex++;

      if (plane) {

    }
  }
  var ind = document.getElementById('tech-page-indicator');
  if (ind) ind.setAttribute('text', 'value', 'PAGE ' + (techniquePageIdx + 1) + ' / ' + techniquePageCount);
  refreshAllRaycasters();
}
function techniquePageNext() { techniquePageIdx = (techniquePageIdx + 1) % techniquePageCount; applyTechniquePage(); }
function techniquePagePrev() { techniquePageIdx = (techniquePageIdx + techniquePageCount - 1) % techniquePageCount; applyTechniquePage(); }

// desde el arranque, para que la Página 1 no sea bloqueada por fantasmas.
