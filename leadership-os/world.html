<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Centris · Neural Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
  a-scene{width:100%;height:100%;}

  /* ── INDICADOR DE VOZ (HUD sobre el canvas) ── */
  #voice-hud {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex; align-items: center; gap: 12px;
    background: rgba(22,32,64,0.92);
    border: 1px solid #2a4080;
    border-radius: 40px;
    padding: 10px 24px;
    font-family: monospace;
    font-size: 0.85rem;
    color: #e8eeff;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #voice-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #2a4080;
    transition: background 0.2s, box-shadow 0.2s;
  }
  #voice-dot.idle     { background: #2a4080; }
  #voice-dot.ready    { background: #00e5a0; box-shadow: 0 0 8px #00e5a0; }
  #voice-dot.rec      { background: #ff5c5c; box-shadow: 0 0 12px #ff5c5c;
                         animation: pulse 0.8s infinite alternate; }
  #voice-dot.thinking { background: #9d5cff; box-shadow: 0 0 10px #9d5cff;
                         animation: pulse 1.2s infinite alternate; }
  @keyframes pulse { from { opacity:1; } to { opacity:0.4; } }
  #voice-label { color: #e8eeff; opacity: 0.85; }

  /* Botón mic (desktop fallback) */
  #mic-btn {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%);
    z-index: 51;
    background: #3d6bff; color: #e8eeff;
    border: none; border-radius: 50%;
    width: 56px; height: 56px;
    font-size: 1.4rem;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(61,107,255,0.4);
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  #mic-btn:hover { background: #5580ff; transform: translateX(-50%) scale(1.08); }
  #mic-btn.recording { background: #ff5c5c; box-shadow: 0 0 20px #ff5c5c; }
</style>
</head>
<body style="margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;">

<!-- Verificar sesión -->
<script>
(function() {
  const token = localStorage.getItem('ldr_session_token');
  if (!token) window.location.href = 'login-vr.html';
})();
</script>

<!-- HUD de voz -->
<div id="voice-hud">
  <div id="voice-dot" class="idle"></div>
  <span id="voice-label">Iniciando micrófono…</span>
</div>

<!-- Botón mic (desktop / fallback) -->
<button id="mic-btn" title="Hablar">🎤</button>

<a-scene background="color: #020810" vr-mode-ui="enabled: true">

    </a-image>
    <a-text value="AJOLIN"     position="0 1.3 0" align="center" color="#1a3aff" width="3" opacity="0.9"></a-text>
    <a-text value="El Agente"  position="0 1.1 0" align="center" color="white"   width="2.5" opacity="0.6"></a-text>
    <a-circle position="0 0.05 0" radius="0.7" color="#1a3aff" opacity="0.06" rotation="-90 0 0"></a-circle>
  </a-entity>

  <!-- ── TÍTULO ── -->
  <a-text value="Neural Academy" position="0 2.2 -3"
    align="center" color="white" font="exo2bold" width="6" opacity="0.9">
  </a-text>
  <a-text value="Centris · Leadership OS" position="0 1.9 -3"
    align="center" color="#00c49a" width="4" opacity="0.6">
  </a-text>

  <!-- ── BURBUJA DE DIÁLOGO ── -->
  <a-entity id="dialog-panel" position="0 1.6 -2.5" visible="false">
    <a-box width="2.8" height="0.8" depth="0.06" color="#080f20" opacity="0.95"></a-box>
    <a-text id="dialog-speaker" value="JUANJOLOTE"
      position="0 0.28 0.04" align="center" color="#00c49a" width="4" opacity="0.8">
    </a-text>
    <a-text id="dialog-text" value="..."
      position="0 0 0.04" align="center" color="white" width="4.5" wrap-count="45" opacity="0.9">

  <!-- ── MOOD BAR ── -->
  <a-entity id="mood-bar" position="0 0.3 -2.2">

    <a-box id="mood-fill"  width="0.36" height="0.07" depth="0.04" color="#ff6b6b" position="-0.32 0 0.01"></a-box>

  <!-- ── BOTÓN LOGOUT (lado izquierdo, gira cabeza) ── -->
  <a-entity position="-2.5 1.8 -2" rotation="0 35 0">
    <a-plane id="btn-logout" width="0.7" height="0.2"
      color="#ff5c5c" material="opacity:0.8;shader:flat;side:double"
      class="clickable">
      <a-text value="Cerrar sesión" color="#e8eeff" align="center"
        width="3" position="0 0 0.01" font="mozillavr">
      </a-text>
    </a-plane>
  </a-entity>

  <!-- ── INDICADOR DE GRABACIÓN VR (visible en headset) ── -->
  <a-entity id="vr-voice-indicator" position="0 0.5 -2.2" visible="false">
    <a-plane width="2.0" height="0.22" color="#080f20"
      material="opacity:0.9;shader:flat;side:double">
    </a-plane>
    <a-circle id="vr-dot" radius="0.07" color="#2a4080"
      material="shader:flat" position="-0.82 0 0.01">
    </a-circle>
    <a-text id="vr-voice-label" value="Listo para escuchar"
      color="#e8eeff" align="left" width="3.5"
      position="-0.65 0 0.01" font="mozillavr">
    </a-text>
  </a-entity>

  <!-- ── CÁMARA ── -->
  <a-camera id="main-camera" position="0 1.6 0"
    look-controls wasd-controls="enabled:false">
    <a-cursor id="vr-cursor"
      raycaster="objects:.clickable;far:10"
      fuse="true" fuse-timeout="1500"
      color="#00c49a" opacity="0.9"
      position="0 0 -1"
      geometry="primitive:ring;radiusInner:0.013;radiusOuter:0.02"
      animation__fuse="property:scale;startEvents:fusing;from:1 1 1;to:0.1 0.1 0.1;dur:1500"
      animation__unfuse="property:scale;startEvents:mouseleave;to:1 1 1;dur:100">
    </a-cursor>
  </a-camera>

</a-scene>

<script>
// ══════════════════════════════════════════════════════════
//  CENTRIS · NEURAL ACADEMY — world.html
//  Voz: MediaRecorder → /api/groq-whisper → Groq LLM
// ══════════════════════════════════════════════════════════

// ─── STATE ───────────────────────────────────────────────
let vrMood        = 30;
let agentHistory  = [];
let isRecording   = false;
let isProcessing  = false;
let mediaRecorder = null;
let audioChunks   = [];
let audioStream   = null;
let audioContext  = null;
let analyser      = null;
let silenceTimer  = null;
let currentMode   = null;

const SILENCE_THRESHOLD = 40;   // 0-255, nivel mínimo de audio
const SILENCE_DURATION  = 1800; // ms de silencio para auto-stop
const MAX_REC_TIME      = 25000; // ms máximo de grabación

// ─── HUD HELPERS ─────────────────────────────────────────
function setHUD(state, label) {
  const dot = document.getElementById('voice-dot');
  const lbl = document.getElementById('voice-label');
  if (dot) { dot.className = ''; dot.classList.add(state); }
  if (lbl) lbl.textContent = label;

  // Espejo en VR
  const vDot = document.getElementById('vr-dot');
  const vLbl = document.getElementById('vr-voice-label');
  const vInd = document.getElementById('vr-voice-indicator');
  const colorMap = { idle:'#2a4080', ready:'#00e5a0', rec:'#ff5c5c', thinking:'#9d5cff' };
  if (vDot) vDot.setAttribute('color', colorMap[state] || '#2a4080');
  if (vLbl) vLbl.setAttribute('text', 'value', label);
  if (vInd) vInd.setAttribute('visible', state !== 'idle');
}

// ─── SETUP MICRÓFONO ────────────────────────────────────
async function setupMic() {
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser     = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    const source = audioContext.createMediaStreamSource(audioStream);
    source.connect(analyser);

    setHUD('ready', 'Listo · Presiona para hablar');
    console.log('[Voice] Micrófono listo');
  } catch(e) {
    setHUD('idle', 'Sin acceso al micrófono');
    console.error('[Voice] Mic error:', e);
  }
}

// ─── INICIAR GRABACIÓN ──────────────────────────────────
function startRecording() {
  if (isRecording || isProcessing || !audioStream) return;

  audioChunks  = [];
  isRecording  = true;

  // Formato compatible con Quest
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus' : 'audio/webm';

  mediaRecorder = new MediaRecorder(audioStream, { mimeType });
  mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();

  setHUD('rec', '🔴 Grabando… habla ahora');
  document.getElementById('mic-btn')?.classList.add('recording');

  // Auto-stop por silencio
  startSilenceDetection();

  // Auto-stop por tiempo máximo
  setTimeout(() => { if(isRecording) stopRecording(); }, MAX_REC_TIME);
}

// ─── DETENER GRABACIÓN ──────────────────────────────────
function stopRecording() {
  if (!isRecording || !mediaRecorder) return;
  isRecording = false;
  if (silenceTimer) { cancelAnimationFrame(silenceTimer); silenceTimer = null; }
  mediaRecorder.stop();
  document.getElementById('mic-btn')?.classList.remove('recording');
  setHUD('thinking', 'Procesando…');
}

// ─── DETECCIÓN DE SILENCIO ──────────────────────────────
function startSilenceDetection() {
  const data      = new Uint8Array(analyser.frequencyBinCount);
  let silenceMs   = 0;
  let lastTime    = performance.now();

  function check() {
    if (!isRecording) return;
    analyser.getByteFrequencyData(data);
    const avg = data.reduce((a,b)=>a+b,0) / data.length;
    const now = performance.now();
    const dt  = now - lastTime;
    lastTime  = now;

    if (avg < SILENCE_THRESHOLD) {
      silenceMs += dt;
      if (silenceMs >= SILENCE_DURATION) { stopRecording(); return; }
    } else {
      silenceMs = 0;
    }
    silenceTimer = requestAnimationFrame(check);
  }
  check();
}

// ─── CUANDO TERMINA LA GRABACIÓN ────────────────────────
async function onRecordingStop() {
  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  if (blob.size < 1000) {
    setHUD('ready', 'No te escuché · intenta de nuevo');
    return;
  }

  isProcessing = true;
  setHUD('thinking', '🔮 Transcribiendo…');

  try {
    // 1. Transcribir con Groq Whisper
    const text = await transcribeAudio(blob);
    if (!text || text.trim().length < 2) {
      setHUD('ready', 'No entendí · intenta de nuevo');
      isProcessing = false;
      return;
    }

    console.log('[Voice] Transcripción:', text);
    setDialog('TÚ', text);
    setHUD('thinking', '🤔 Pensando…');

    // 2. Procesar con Groq LLM
    await handleVRSpeech(text);

  } catch(e) {
    console.error('[Voice] Error:', e);
    setHUD('ready', 'Error · intenta de nuevo');
  } finally {
    isProcessing = false;
  }
}

// ─── TRANSCRIBIR CON GROQ WHISPER ───────────────────────
async function transcribeAudio(blob) {
  const form = new FormData();
  // Groq Whisper espera: file, model, language
  form.append('file', blob, 'recording.webm');
  form.append('model', 'whisper-large-v3-turbo');
  form.append('language', 'es');
  form.append('response_format', 'json');

  const res  = await fetch('/api/groq-whisper', { method:'POST', body: form });
  const data = await res.json();
  return data.text || '';
}

// ─── HANDLE SPEECH (LLM) ─────────────────────────────────
async function handleVRSpeech(text) {
  if (!text.trim()) return;
  agentHistory.push({ role:'user', content: text });
  setAjolinMood('neutral');

  try {
    const reply = await callGroqVR();
    const { msg, newMood } = parseVRReply(reply);
    agentHistory.push({ role:'assistant', content: reply });

    setDialog('AJOLIN', msg);
    updateVRMood(newMood);

    if      (newMood > 60) setAjolinMood('happy');
    else if (newMood < 30) setAjolinMood('sad');
    else                   setAjolinMood('talking');

    speakVR(msg, 'ajolin', () => {
      setHUD('ready', 'Listo · presiona para hablar');
    });

  } catch(e) {
    setDialog('SISTEMA', 'Error de conexión.');
    setHUD('ready', 'Error · intenta de nuevo');
  }
}

// ─── GROQ LLM ────────────────────────────────────────────
async function callGroqVR() {
  const sys = `Eres Carlos Mendoza, agente de call center defensivo, 2 años en la empresa.
Te sientes culpado por métricas que no controlas. Quieres estudiar ingeniería en sistemas. Tienes dos hijos.
Responde naturalmente — defensivo pero capaz de abrirte si el supervisor es empático.
Al final de CADA respuesta agrega: [MOOD:XX] donde XX es 0-100. Empieza en 30.
Respuestas CORTAS — máximo 2 oraciones. Conversación VR hablada.`;

  const res  = await fetch('/api/groq', {
    method:  'POST',
    headers: { 'Content-Type':'application/json' },
    body:    JSON.stringify({
      model:       'llama-3.1-8b-instant',
      messages:    [{ role:'system', content:sys }, ...agentHistory.slice(-10)],
      max_tokens:  120,
      temperature: 0.85
    })
  });
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '...';
}

function parseVRReply(raw) {
  const m   = raw.match(/\[MOOD:(\d+)\]/);
  const msg = raw.replace(/\[MOOD:\d+\]/g,'').trim();
  return { msg, newMood: m ? parseInt(m[1]) : vrMood };
}

// ─── TTS ─────────────────────────────────────────────────
function speakVR(text, who, onEnd) {
  if (!window.speechSynthesis) { if(onEnd) onEnd(); return; }
  window.speechSynthesis.cancel();

  if (who==='ajolin') setAjolinMood('talking');
  else                setJuanMood('talking');

  const utt   = new SpeechSynthesisUtterance(text);
  utt.lang    = 'es-MX';
  utt.rate    = 0.88;
  utt.pitch   = who==='ajolin' ? 0.85 : 1.1;
  const voices = window.speechSynthesis.getVoices();
  const es     = voices.find(v=>v.lang.startsWith('es')) || null;
  if (es) utt.voice = es;

  utt.onend = () => {
    if (who==='ajolin') setAjolinMood('neutral');
    else                setJuanMood('neutral');
    if (onEnd) onEnd();
  };
  window.speechSynthesis.speak(utt);
}

// ─── DIALOG ──────────────────────────────────────────────
function setDialog(speaker, text) {
  const panel = document.getElementById('dialog-panel');
  panel.setAttribute('visible', true);
  document.getElementById('dialog-speaker').setAttribute('text', 'value', speaker);
  document.getElementById('dialog-text').setAttribute('text', 'value', text);
}

// ─── MOODS ───────────────────────────────────────────────
function setJuanMood(mood) {
  const map = { neutral:'#juan-neutral', happy:'#juan-happy', talking:'#juan-talking', sad:'#juan-sad' };
  document.getElementById('juan-img').setAttribute('src', map[mood]||'#juan-neutral');
}
function setAjolinMood(mood) {
  const map = { neutral:'#ajolin-neutral', happy:'#ajolin-happy',
                talking:'#ajolin-talking', sad:'#ajolin-sad', surprised:'#ajolin-surprised' };
  document.getElementById('ajolin-img').setAttribute('src', map[mood]||'#ajolin-neutral');
}

// ─── MOOD BAR ────────────────────────────────────────────
function updateVRMood(val) {
  vrMood = Math.max(0, Math.min(100, val));
  const color = vrMood<35 ? '#ff6b6b' : vrMood<60 ? '#f5a623' : '#1ec99a';
  const width = 0.12 + (vrMood/100)*1.08;
  const xPos  = -0.32 + ((vrMood/100)*0.54);
  document.getElementById('mood-fill').setAttribute('color', color);
  document.getElementById('mood-fill').setAttribute('width', width);
  document.getElementById('mood-fill').setAttribute('position', `${xPos} 0 0.01`);
  document.getElementById('mood-pct').setAttribute('text', 'value', vrMood+'%');
}

// ─── SALUDO ──────────────────────────────────────────────
function greetUser() {
  const gameId = localStorage.getItem('ldr_game_id') || '';
  const name   = gameId.split('.')[1] || 'Manager';
  setDialog('JUANJOLOTE', `¡Bienvenido ${name}! Soy Juanjolote. Cuando estés listo, presiona el botón del micrófono y habla con Carlos.`);
  setJuanMood('happy');
  speakVR(`Bienvenido ${name}. Soy Juanjolote. Presiona el micrófono cuando estés listo para hablar con Carlos.`);
}

// ─── CONTROLADORES QUEST ────────────────────────────────
function setupControllers() {
  const scene = document.querySelector('a-scene');
  const rc = document.createElement('a-entity');
  rc.setAttribute('oculus-touch-controls','hand:right');
  rc.setAttribute('raycaster','objects:.clickable;far:8;showLine:true;lineColor:#00c49a;lineOpacity:0.7');
  scene.appendChild(rc);

  const lc = document.createElement('a-entity');
  lc.setAttribute('oculus-touch-controls','hand:left');
  lc.setAttribute('raycaster','objects:.clickable;far:8;showLine:true;lineColor:#7c3aff;lineOpacity:0.5');
  scene.appendChild(lc);

  // Trigger derecho → grabar / parar
  rc.addEventListener('triggerdown', () => {
    if (!isRecording && !isProcessing) startRecording();
    else if (isRecording) stopRecording();
  });

  // Trigger izquierdo → también grabar
  lc.addEventListener('triggerdown', () => {
    if (!isRecording && !isProcessing) startRecording();
    else if (isRecording) stopRecording();
  });

  // Botón A (Quest) → grabar
  rc.addEventListener('abuttondown', () => {
    if (!isRecording && !isProcessing) startRecording();
    else if (isRecording) stopRecording();
  });
}

// ─── INIT ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {

  // Botón mic desktop
  const micBtn = document.getElementById('mic-btn');
  micBtn?.addEventListener('click', () => {
    if (!isRecording && !isProcessing) startRecording();
    else if (isRecording) stopRecording();
  });

  // Logout
  document.getElementById('btn-logout')?.addEventListener('click', () => {
    localStorage.removeItem('ldr_session_token');
    localStorage.removeItem('ldr_refresh_token');
    window.location.href = 'login-vr.html';
  });

  // A-Frame listo
  document.querySelector('a-scene').addEventListener('loaded', () => {
    setupControllers();
    setupMic().then(() => {
      setTimeout(greetUser, 1200);
    });

    // Historial inicial de Carlos
    agentHistory = [{ role:'assistant', content:'...Yeah? You wanted to see me?' }];
  });
});

window.speechSynthesis?.addEventListener('voiceschanged', ()=>{});
</script>
