<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Centris · Neural Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#060818;}
  a-scene{width:100%;height:100%;}

  /* HUD VOZ */
  #voice-hud{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    z-index:50;display:flex;align-items:center;gap:10px;
    background:rgba(15,20,50,0.85);border:1px solid #2a3a7a;
    border-radius:40px;padding:9px 22px;font-family:monospace;
    font-size:0.8rem;color:#c8d8ff;pointer-events:none;
    backdrop-filter:blur(8px);
  }
  #voice-dot{width:11px;height:11px;border-radius:50%;background:#1a2a6a;transition:all 0.2s;}
  #voice-dot.ready   {background:#00e5c0;box-shadow:0 0 10px #00e5c0;}
  #voice-dot.rec     {background:#ff5ca0;box-shadow:0 0 14px #ff5ca0;animation:pulse 0.8s infinite alternate;}
  #voice-dot.thinking{background:#9d5cff;box-shadow:0 0 12px #9d5cff;animation:pulse 1.2s infinite alternate;}
  @keyframes pulse{from{opacity:1}to{opacity:0.3}}

  /* BTN MIC DESKTOP */
  #mic-btn{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    z-index:51;background:linear-gradient(135deg,#3d6bff,#9d5cff);
    color:#fff;border:none;border-radius:50%;width:54px;height:54px;
    font-size:1.3rem;cursor:pointer;box-shadow:0 4px 24px rgba(100,100,255,0.5);
    display:flex;align-items:center;justify-content:center;transition:all 0.15s;
  }
  #mic-btn:hover{transform:translateX(-50%) scale(1.1);}
  #mic-btn.recording{background:linear-gradient(135deg,#ff5ca0,#ff3c6b);box-shadow:0 0 24px #ff5ca0;}
</style>
</head>
<body>

<!-- Verificar sesión -->
<script>
(function(){
  const t = localStorage.getItem('ldr_session_token');
  if(!t) window.location.href = 'login-vr.html';
})();
</script>

<!-- Scripts de la app principal — misma lógica -->
<script src="js/interventions.js"></script>
<script src="js/archetypes.js"></script>
<script src="js/techniques.js"></script>
<script src="js/prompts.js"></script>

<div id="voice-hud">
  <div id="voice-dot" class="idle"></div>
  <span id="voice-label">Iniciando Neural Academy…</span>
</div>
<button id="mic-btn" title="Hablar">🎤</button>

function setHUD(state, label) {

// ─── ALEATORIDAD — el corazón del sistema ────────────────
function pickRandomArchetype() {
  const ids = Object.keys(ARCHETYPES).filter(id => ARCHETYPES[id].available);
  return ARCHETYPES[ids[Math.floor(Math.random() * ids.length)]];
}

function pickRandomScenario(archetype, level) {
  const pool = archetype.briefings[level] || archetype.briefings['novice'] || [];
  if(!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function pickRandomOpener(archetype, scenario) {
  const state = scenario?.carlosState || scenario?.agentState || 'guarded-tired';
  if(archetype.openers && archetype.openers[state]) {
    return archetype.openers[state];
  }
  const openerVals = Object.values(archetype.openers||{});
  return openerVals[Math.floor(Math.random()*openerVals.length)] || '...';
}

// ─── MOOD BAR ────────────────────────────────────────────
function updateVRMood(val) {
  appState.vrMood = Math.max(0, Math.min(100, val));
  const pct   = appState.vrMood / 100;
  const color = appState.vrMood < 35 ? '#ff5ca0' : appState.vrMood < 60 ? '#f5a623' : '#00e5c0';
  const w     = 0.07 + pct * 0.63;
  const x     = -0.315 + pct * 0.315;
  const fill  = document.getElementById('mood-fill');
  const pctEl = document.getElementById('mood-pct');
  if(fill){
    fill.setAttribute('color', color);
    fill.setAttribute('width', w);
    fill.setAttribute('position', `${x} 0.02 0.015`);
  }
  if(pctEl) pctEl.setAttribute('text','value', appState.vrMood+'%');
}

// ─── LLAMADA AL LLM ──────────────────────────────────────
async function callGroqLLM(mode) {
  let systemPrompt;

  if(mode === 'practice') {
    systemPrompt = PROMPTS.avatar(appState.currentLevel);
  } else if(mode === 'learn') {
    // Juanjolote enseña
    systemPrompt = `Eres Juanjolote, coach de liderazgo cálido y directo en Centris Neural Academy.
Estás enseñando sobre ${appState.activeMenu === 'interventions' ? 'intervenciones de retención' : 'técnicas de comunicación'}.
Habla en español. Conversacional, máximo 3 oraciones. Haz preguntas. Nunca des conferencias.
Conecta todo a situaciones reales de call center.`;
  } else if(mode === 'work') {
    systemPrompt = `Eres Juanjolote, coach socrático en Centris Neural Academy.
Tu rol es hacer preguntas que ayuden al manager a descubrir sus propios insights.
NUNCA des consejos directos. Haz UNA pregunta a la vez. Máximo 2 oraciones.
Habla en español. Sé cálido pero directo.`;
  }

  const res  = await fetch('/api/groq', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      model:       'llama-3.3-70b-versatile',
      messages:    [{role:'system',content:systemPrompt}, ...appState.agentHistory.slice(-12)],
      max_tokens:  150,
      temperature: 0.88
    })
  });
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '...';
}

// ─── PARSEAR RESPUESTA DEL AGENTE ────────────────────────
function parseAgentReply(raw) {
  const moodMatch = raw.match(/\[MOOD:(\d+)\]/);
  const boxMatch  = raw.match(/\[BOX:(in|out)\]/);
  const msg = raw.replace(/\[MOOD:\d+\]/g,'')
                  .replace(/\[BOX:(in|out)\]/g,'')
                  .replace(/\[TRIGGER:\w+\]/g,'')
                  .replace(/\[CLOSED:(true|false)\]/g,'')
                  .trim();
  return {
    msg,
    newMood: moodMatch ? parseInt(moodMatch[1]) : appState.vrMood,
    boxState: boxMatch ? boxMatch[1] : appState.boxState
  };
}

// ─── HANDLE SPEECH ───────────────────────────────────────
async function handleVRSpeech(text) {
  if(!text.trim()) return;

  const mode = appState.screen === 'practice' ? (
    appState.currentArchetype ? 'practice' :
    appState.agentHistory[0]?.content?.includes('técnica') ? 'learn' : 'learn'
  ) : 'learn';

  appState.agentHistory.push({role:'user', content: text});

  try {
    const reply = await callGroqLLM(mode === 'practice' ? 'practice' :
      appState.activeMenu ? 'learn' : 'work');
    const parsed = mode === 'practice' ? parseAgentReply(reply) : {msg: reply, newMood: appState.vrMood, boxState: 'out'};

    appState.agentHistory.push({role:'assistant', content: reply});

    if(mode === 'practice') {
      updateVRMood(parsed.newMood);
      appState.boxState = parsed.boxState;
      if(parsed.newMood > 60)       setAjolinMood('happy');
      else if(parsed.newMood < 30)  setAjolinMood('sad');
      else                          setAjolinMood('talking');
      setDialog(appState.currentArchetype.name.toUpperCase(), parsed.msg);
    } else {
      setJuanMood('talking');
      setDialog('JUANJOLOTE', parsed.msg);
    }

    speakVR(parsed.msg, mode === 'practice' ? 'agent' : 'juan', () => {
      setHUD('ready','Listo · Trigger para hablar');
      if(mode === 'practice') setAjolinMood('neutral');
      else setJuanMood('neutral');
    });

  } catch(e) {
    console.error('[LLM]',e);
    setHUD('ready','Error · intenta de nuevo');
  }
}

    });
    const data = await res.json();
    const feedback = data.choices?.[0]?.message?.content || 'Sesión completada.';
    document.getElementById('eval-feedback')?.setAttribute('text','value', feedback);
    speakVR(feedback, 'juan');
  } catch(e) {
    document.getElementById('eval-feedback')?.setAttribute('text','value','Sesión completada. Buen trabajo.');
  }
}

async function speakVR(text, who, onEnd) {
  try {
    const voice = who === 'juan' ? 'onyx' : 'nova';

    const res = await fetch('/api/openai-tts', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ text, voice })
    });

    if (!res.ok) throw new Error('TTS ' + res.status);

    const blob      = await res.blob();
    const url       = URL.createObjectURL(blob);
    const audio     = new Audio(url);

    audio.onended = () => {
      URL.revokeObjectURL(url); // limpia memoria
      if (onEnd) onEnd();
    };

    audio.onerror = (e) => {
      console.error('[TTS audio error]', e);
      if (onEnd) onEnd();
    };

    await audio.play();

  } catch (err) {
    console.error('[TTS]', err);
    if (onEnd) onEnd(); // no bloquea el flujo si falla
  }

// ─── MICRÓFONO ───────────────────────────────────────────
async function setupMic() {
  try {
    audioStream  = await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    audioContext = new (window.AudioContext||window.webkitAudioContext)();
    analyser     = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    audioContext.createMediaStreamSource(audioStream).connect(analyser);
    setHUD('ready','Listo · Trigger para hablar');
  } catch(e) {
    setHUD('idle','Sin micrófono — modo texto');
    console.error('[Mic]',e);
  }
}

function startRecording() {
  if(isRecording||isProcessing||!audioStream) return;
  audioChunks = [];
  isRecording = true;

  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus' : 'audio/webm';
  mediaRecorder = new MediaRecorder(audioStream,{mimeType:mime});
  mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) audioChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();

  setHUD('rec','🔴 Grabando…');
  document.getElementById('mic-btn')?.classList.add('recording');
  startSilenceDetection();
  setTimeout(()=>{ if(isRecording) stopRecording(); }, 25000);
}

function stopRecording() {
  if(!isRecording||!mediaRecorder) return;
  isRecording = false;
  if(silenceTimer){ cancelAnimationFrame(silenceTimer); silenceTimer=null; }
  mediaRecorder.stop();
  document.getElementById('mic-btn')?.classList.remove('recording');
  setHUD('thinking','Procesando…');
}

function startSilenceDetection() {
  const data    = new Uint8Array(analyser.frequencyBinCount);
  let silenceMs = 0, lastTime = performance.now();
  function check() {
    if(!isRecording) return;
    analyser.getByteFrequencyData(data);
    const avg = data.reduce((a,b)=>a+b,0)/data.length;
    const now = performance.now();
    const dt  = now - lastTime; lastTime = now;
    if(avg < SILENCE_THRESHOLD){ silenceMs+=dt; if(silenceMs>=SILENCE_DURATION){ stopRecording(); return; } }
    else silenceMs=0;
    silenceTimer = requestAnimationFrame(check);
  }
  check();
}

async function onRecordingStop() {
  const blob = new Blob(audioChunks,{type:'audio/webm'});
  if(blob.size < 800){ setHUD('ready','No te escuché · intenta de nuevo'); return; }
  isProcessing = true;
  try {
    const text = await transcribeAudio(blob);
    if(!text||text.trim().length<2){ setHUD('ready','No entendí · intenta de nuevo'); isProcessing=false; return; }
    console.log('[Whisper]',text);
    if(appState.screen==='practice') setDialog('TÚ',text);
    setHUD('thinking','Pensando…');
    await handleVRSpeech(text);
  } catch(e) {
    console.error('[Voice]',e);
    setHUD('ready','Error · intenta de nuevo');
  } finally { isProcessing=false; }
}

async function transcribeAudio(blob) {
  const form = new FormData();
  form.append('file', blob, 'rec.webm');
  form.append('model','whisper-large-v3-turbo');
  form.append('language','es');
  form.append('response_format','json');
  const res  = await fetch('/api/groq-whisper',{method:'POST',body:form});
  const data = await res.json();
  return data.text||'';
}

// ─── CONTROLADORES QUEST ─────────────────────────────────
function setupControllers() {
  const scene = document.querySelector('a-scene');

  const rc = document.createElement('a-entity');
  rc.setAttribute('oculus-touch-controls','hand:right');
  rc.setAttribute('raycaster','objects:.clickable;far:6;showLine:true;lineColor:#00e5c0;lineOpacity:0.7');
  scene.appendChild(rc);

  const lc = document.createElement('a-entity');
  lc.setAttribute('oculus-touch-controls','hand:left');
  lc.setAttribute('raycaster','objects:.clickable;far:6;showLine:true;lineColor:#9d5cff;lineOpacity:0.5');
  scene.appendChild(lc);

  // Trigger → click o grabar
  [rc, lc].forEach(ctrl=>{
    ctrl.addEventListener('triggerdown',()=>{
      const hit = ctrl.components?.raycaster?.intersectedEls?.[0];
      if(hit){ hit.click(); return; }
      // Sin target → hablar
      if(appState.screen==='practice'){
        if(!isRecording&&!isProcessing) startRecording();
        else if(isRecording) stopRecording();
      }
    });
  });

  // Botón A → grabar
  rc.addEventListener('abuttondown',()=>{
    if(appState.screen==='practice'){
      if(!isRecording&&!isProcessing) startRecording();
      else if(isRecording) stopRecording();
    }
  });
}
