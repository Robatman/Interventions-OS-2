<script>  
AFRAME.registerComponent('handler-botones-vr', {
  schema: {
    mensaje: {type: 'string', default: 'Botón presionado'},
    tecnica: {type: 'string', default: 'generica'}
  },
  
  init: function () {
    var el = this.el;
    var data = this.data;

    el.addEventListener('click', function (evt) {
      // 🔒 SI EL BOTÓN ESTÁ OCULTO (O SU PANTALLA PADRE), IGNORAMOS EL EVENTO completamente
      if (el.object3D && el.object3D.visible === false) {
        return;
      }

      if (evt.detail && evt.detail.sourceEvent) {
        evt.detail.sourceEvent.stopPropagation();
        evt.detail.sourceEvent.preventDefault();
      }
      evt.stopPropagation(); 
      
      console.log(`🎯 [VR Click] ${data.mensaje} (ID: ${el.id || el.parentElement.id})`);
      ejecutarFuncionPorTecnica(data.tecnica);
    });
  }
});
  // 🌟 LAS FUNCIONES AHORA VIVEN AFUERA Y SON GLOBALES 🌟

function ejecutarFuncionPorTecnica(tecnica) {
  console.log("⚡ Buscando técnica:", tecnica);

  switch(tecnica) {
    case 'active-listening':
      funcionActiveListening();
      break;

    case 'powerful-questions':
      funcionPowerfulQuestions();
      break;

    case 'motivational-interviewing':
      funcionMotivationalInterviewing();
      break;

    case 'nonviolent-communication':
      funcionNonviolentCommunication();
      break;

    case 'radical-candor':
      funcionRadicalCandor();
      break;

    case 'crucial-conversations':
      funcionCrucialConversations();
      break;

    case 'tactical-empathy':
      funcionTacticalEmpathy();
      break;

    case 'scarf-model':
      funcionScarfModel();
      break;

    case 'immunity-to-change':
      funcionImmunityToChange();
      break;

    case 'drama-triangle':
      funcionDramaTriangle();
      break;

    case 'grow-model':
      funcionGrowModel();
      break;

    case 'strengths-based-coaching':
      funcionStrengthsBasedCoaching();
      break;

    case 'growth-mindset':
      funcionGrowthMindset();
      break;

    case 'solution-focused-coaching':
      funcionSolutionFocusedCoaching();
      break;



    case 'interventions':
      funcionShowInterventions();
      break;
    case 'techniques':
      funcionShowtechniques();
      break;


      
    default:
      console.log("⚡ Ejecutando función genérica de la academia.");
  }
}

    console.log("🗣️ Activando entorno de Escucha Activa...");

function setHUD(state,label){
  var dot=document.getElementById('voice-dot'),lbl=document.getElementById('voice-label');
  if(dot){dot.className='';dot.classList.add(state);}
  if(lbl)lbl.textContent=label;
  var vDot=document.getElementById('vr-voice-dot'),vLbl=document.getElementById('vr-voice-label'),vBar=document.getElementById('vr-voice-bar');
  var colors={idle:'#1a2a6a',ready:'#00e5c0',rec:'#ff5ca0',thinking:'#9d5cff'};
  if(vDot)vDot.setAttribute('color',colors[state]||'#1a2a6a');
  if(vLbl)vLbl.setAttribute('text','value',label);
  if(vBar)vBar.setAttribute('visible',state!=='idle');
}

function pickRandomArchetype(){
  var ids=Object.keys(ARCHETYPES).filter(function(id){return ARCHETYPES[id].available;});
  return ARCHETYPES[ids[Math.floor(Math.random()*ids.length)]];
}

function pickRandomScenario(archetype,level){
  var pool=archetype.briefings[level]||archetype.briefings['novice']||[];
  if(!pool.length)return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function pickRandomOpener(archetype,scenario){
  var state=(scenario&&(scenario.carlosState||scenario.agentState))||'guarded-tired';
  if(archetype.openers&&archetype.openers[state])return archetype.openers[state];
  var vals=Object.values(archetype.openers||{});
  return vals[Math.floor(Math.random()*vals.length)]||'...';
}

async function callGroqLLM(mode){
  var systemPrompt='';
  if(mode==='practice'){
    systemPrompt=PROMPTS.avatar(appState.currentLevel);
  } else if(mode==='learn'){
    systemPrompt='Eres Juanjolote, coach de liderazgo calido y directo en Centris Neural Academy. Estas ensenando sobre '+(appState.activeMenu==='interventions'?'intervenciones de retencion':'tecnicas de comunicacion')+'. Habla en espanol. Conversacional, maximo 3 oraciones. Haz preguntas. Nunca des conferencias. Conecta todo a situaciones reales de call center.';
  } else if(mode==='work'){
    systemPrompt='Eres Juanjolote, coach socratico en Centris Neural Academy. Tu rol es hacer preguntas que ayuden al manager a descubrir sus propios insights. NUNCA des consejos directos. Haz UNA pregunta a la vez. Maximo 2 oraciones. Habla en espanol. Se calido pero directo.';
  }
  var res=await fetch('/api/groq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:systemPrompt},...appState.agentHistory.slice(-12)],max_tokens:150,temperature:0.88})});
  var data=await res.json();
  return (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||'...';
}

function parseAgentReply(raw){
  var moodMatch=raw.match(/\[MOOD:(\d+)\]/),boxMatch=raw.match(/\[BOX:(in|out)\]/);
  var msg=raw.replace(/\[MOOD:\d+\]/g,'').replace(/\[BOX:(in|out)\]/g,'').replace(/\[TRIGGER:\w+\]/g,'').replace(/\[CLOSED:(true|false)\]/g,'').trim();
  return {msg:msg,newMood:moodMatch?parseInt(moodMatch[1]):appState.vrMood,boxState:boxMatch?boxMatch[1]:appState.boxState};
}

async function handleVRSpeech(text) {
  if (!text.trim()) return;
  var mode = appState.currentArchetype ? 'practice' : 'learn';
  appState.agentHistory.push({ role: 'user', content: text });
  
  try {
    var reply = await callGroqLLM(mode === 'practice' ? 'practice' : appState.activeMenu ? 'learn' : 'work');
    var parsed = mode === 'practice' ? parseAgentReply(reply) : { msg: reply, newMood: appState.vrMood, boxState: 'out' };
    appState.agentHistory.push({ role: 'assistant', content: reply });
    
    if (mode === 'practice') {
      updateVRMood(parsed.newMood);
      appState.boxState = parsed.boxState;
      if (parsed.newMood > 60) setAjolinMood('happy');
      else if (parsed.newMood < 30) setAjolinMood('sad');
      else setAjolinMood('talking');
      setDialog(appState.currentArchetype.name.toUpperCase(), parsed.msg);
    } else {
      setJuanMood('talking');
      setDialog('JUANJOLOTE', parsed.msg);
    }

    speakVR(
      parsed.msg,
      getVoice(mode === 'practice' ? 'agent' : 'juan'),
      function () {
        setHUD('ready', 'Listo para hablar');
        if (mode === 'practice') {
          setAjolinMood('neutral');
        } else {
          setJuanMood('neutral');
        }
      }
    );

  } catch (e) {
    console.error('[LLM]', e);
    setHUD('ready', 'Error, intenta de nuevo');
  }
}

async function speakVR(text, voice = "Fritz-PlayAI", callback = null) {

  // traducir
  const englishText = await translateToEnglish(text);

  console.log("Translated:", englishText);

  // pedir audio
  const speechResponse = await fetch('/api/groq_speakvr', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      type: 'speech',
      text: englishText,
      voice: voice
    })
  });

  if (!speechResponse.ok) {

    const err = await speechResponse.text();

    console.error("TTS ERROR:", err);

    return;
  }

  const blob = await speechResponse.blob();

  const url = URL.createObjectURL(blob);

  const audio = new Audio(url);

  audio.onended = () => {

    URL.revokeObjectURL(url);

    if (callback) {
      callback();
    }
  };

await audio.play();
}

async function setupMic(){
  try{
    console.log('[Mic] Solicitando permisos de micrófono...');
    audioStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    console.log('[Mic] Permisos concedidos. Stream obtenido:', audioStream.id);
    
    audioContext=new (window.AudioContext||window.webkitAudioContext)();
    console.log('[Mic] AudioContext estado inicial:', audioContext.state);
    
    analyser=audioContext.createAnalyser();
    analyser.fftSize=2048;
    audioContext.createMediaStreamSource(audioStream).connect(analyser);
    setHUD('ready','Listo para hablar');
    console.log('[Mic] Configuración completa y Analyser conectado.');
  } catch(e){
    setHUD('idle','Sin microfono - modo texto');
    console.error('[Mic] Error en setupMic:',e);
  }
}

function startRecording(){
  console.log('[Grabación] Intento de iniciar grabación. Estado actual -> isRecording:', isRecording, 'isProcessing:', isProcessing, 'hasAudioStream:', !!audioStream);
  if(isRecording||isProcessing||!audioStream) return;
  
  // Reactivar AudioContext por si el navegador lo suspendió (muy común)
  if (audioContext && audioContext.state === 'suspended') {
    console.log('[Mic] AudioContext suspendido. Intentando reactivar...');
    audioContext.resume();
  }

  audioChunks=[]; isRecording=true;
  var mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
  console.log('[Grabación] Usando formato MIME:', mime);
  
  mediaRecorder=new MediaRecorder(audioStream,{mimeType:mime});
  
  mediaRecorder.ondataavailable=function(e){
    if(e.data.size>0){
      audioChunks.push(e.data);
      console.log('[Grabación] Chunk recibido. Tamaño:', e.data.size, 'bytes. Total chunks:', audioChunks.length);
    } else {
      console.warn('[Grabación] Chunk recibido pero está VACÍO (0 bytes)');
    }
  };
  
  mediaRecorder.onstop=onRecordingStop;
  mediaRecorder.start();
  setHUD('rec','Grabando...');
  var btn=document.getElementById('mic-btn'); if(btn)btn.classList.add('recording');
  
  console.log('[Grabación] Empezando detección de silencio...');
  // startSilenceDetection();
  
  setTimeout(function(){
    if(isRecording){
      console.log('[Grabación] Límite de 25 segundos alcanzado. Forzando parada.');
      stopRecording();
    }
  },25000);
}

function stopRecording(){
  console.log('[Grabación] stopRecording invocado. ¿Registrando?:', isRecording);
  if(!isRecording||!mediaRecorder)return;
  isRecording=false;
  if(silenceTimer){
    console.log('[Grabación] Limpiando temporizador de silencio.');
    cancelAnimationFrame(silenceTimer);
    silenceTimer=null;
  }
  mediaRecorder.stop();
  var btn=document.getElementById('mic-btn');if(btn)btn.classList.remove('recording');
  setHUD('thinking','Procesando...');
}

function startSilenceDetection(){
  var data=new Uint8Array(analyser.frequencyBinCount),silenceMs=0,lastTime=performance.now();
  console.log('[Silencio] Detección iniciada. Umbral (SILENCE_THRESHOLD):', typeof SILENCE_THRESHOLD !== 'undefined' ? SILENCE_THRESHOLD : 'No definido');
  
  function check(){
    if(!isRecording) return;
    analyser.getByteFrequencyData(data);
    var avg=data.reduce(function(a,b){return a+b;},0)/data.length;
    var now=performance.now(),dt=now-lastTime; lastTime=now;
    
    // Descomenta la línea de abajo si quieres ver el volumen en tiempo real (puede saturar la consola)
    // console.log('[Silencio] Volumen promedio actual:', avg);
    
    if(avg<SILENCE_THRESHOLD){
      silenceMs+=dt;
      if(silenceMs>=SILENCE_DURATION){
        console.log(`[Silencio] Silencio detectado por ${silenceMs}ms (Límite: ${SILENCE_DURATION}ms). Deteniendo grabación automáticamente.`);
        stopRecording();
        return;
      }
    } else {
      if(silenceMs > 0) console.log('[Silencio] Ruido detectado, reseteando contador de silencio. Volumen:', avg);
      silenceMs=0;
    }
    silenceTimer=requestAnimationFrame(check);
  }
  check();
}

async function onRecordingStop(){
  console.log('[Grabación] MediaRecorder se ha detenido. Armando el Blob...');
  var blob=new Blob(audioChunks,{type:'audio/webm'});
  console.log('[Grabación] Archivo de audio generado -> Tamaño total:', blob.size, 'bytes');
  
  if(blob.size<800){
    console.error('[Grabación] El archivo de audio es DEMASIADO PEQUEÑO (menor a 800 bytes). Se cancela el envío.');
    setHUD('ready','No te escuche, intenta de nuevo');
    return;
  }
  
  isProcessing=true;
  try{
    console.log('[Whisper] Enviando audio a transcribir...');
    var text=await transcribeAudio(blob);
    console.log('[Whisper] Respuesta cruda recibida de la función transcribir:', text);
    
    if(!text||text.trim().length<2){
      console.warn('[Whisper] La transcripción regresó vacía o demasiado corta.');
      setHUD('ready','No entendi, intenta de nuevo');
      isProcessing=false;
      return;
    }
    
    console.log('[Whisper] Transcripción exitosa:', text);
    if(appState.screen==='practice') setDialog('TU',text);
    setHUD('thinking','Pensando...');
    
    console.log('[VR] Ejecutando handleVRSpeech con el texto...');
    await handleVRSpeech(text);
  } catch(e){
    console.error('[Voice] Error crítico en el flujo de parada/transcripción:', e);
    setHUD('ready','Error, intenta de nuevo');
  } finally {
    isProcessing=false;
    console.log('[Grabación] Ciclo finalizado. Listo para la siguiente instrucción.');
  }
}

async function transcribeAudio(blob) {
  var form = new FormData();
  form.append('file', blob, 'rec.webm');

  console.log('[Frontend] Enviando audio a nuestro backend seguro...');
  try {
    var res = await fetch('/api/transcribe', {
      method: 'POST',
      body: form // 👈 ¡ASEGÚRATE DE QUE ESTA LÍNEA ESTÉ AQUÍ!
    });

    console.log('[Frontend] Status Code de la API:', res.status);
    var data = await res.status === 200 ? await res.json() : await res.json().catch(() => ({}));

    if (!res.ok) {
      throw new Error(data.error || 'Error desconocido en el servidor');
    }

    return data.text || '';
  } catch (fetchError) {
    console.error('[Frontend] Error de conexión o procesamiento:', fetchError);
    throw fetchError;
  }
}
