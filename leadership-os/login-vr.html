<body>

<!-- Loading -->
<div id="loading">
  <h2>CENTRIS</h2>
  <p>Leadership OS · Neural Academy</p>
  <p style="color:#9d5cff;margin-top:20px;font-size:0.75rem;">Iniciando…</p>
</div>

<!-- Fondo VR con A-Frame (decorativo) -->
<div id="vr-bg">
  <a-scene
    vr-mode-ui="enabled:false"
    background="color:#0d1628"
    renderer="antialias:true"
    style="width:100%;height:100%;">
    <!-- Anillos orbitando -->
    <a-torus position="0 0 -6" radius="4" radius-tubular="0.04"
      color="#2a4080" material="opacity:0.25;transparent:true;shader:flat"
      animation="property:rotation;to:0 360 0;loop:true;dur:20000;easing:linear">
    </a-torus>
    <a-torus position="0 0 -6" rotation="60 0 0" radius="3" radius-tubular="0.03"
      color="#3d6bff" material="opacity:0.15;transparent:true;shader:flat"
      animation="property:rotation;to:60 360 0;loop:true;dur:14000;easing:linear">
    </a-torus>
    <!-- Partículas -->
    <a-sphere position="-3 2 -5"  radius="0.05" color="#00e5a0" material="shader:flat;opacity:0.6"
      animation="property:position;to:-3 2.4 -5;loop:true;dur:3000;dir:alternate;easing:easeInOutSine">
    </a-sphere>
    <a-sphere position="4 1 -7"   radius="0.04" color="#9d5cff" material="shader:flat;opacity:0.5"
      animation="property:position;to:4 1.5 -7;loop:true;dur:2500;dir:alternate;easing:easeInOutSine">
    </a-sphere>
    <a-sphere position="-5 3 -8"  radius="0.06" color="#3d6bff" material="shader:flat;opacity:0.4"
      animation="property:position;to:-5 3.6 -8;loop:true;dur:4000;dir:alternate;easing:easeInOutSine">
    </a-sphere>
    <a-sphere position="2 4 -6"   radius="0.03" color="#00e5a0" material="shader:flat;opacity:0.7"
      animation="property:position;to:2 4.4 -6;loop:true;dur:2000;dir:alternate;easing:easeInOutSine">
    </a-sphere>
    <a-sphere position="-1 1 -4"  radius="0.04" color="#9d5cff" material="shader:flat;opacity:0.5"
      animation="property:position;to:-1 1.5 -4;loop:true;dur:3500;dir:alternate;easing:easeInOutSine">
    </a-sphere>
    <a-sphere position="5 2.5 -9" radius="0.05" color="#3d6bff" material="shader:flat;opacity:0.35"
      animation="property:position;to:5 3.0 -9;loop:true;dur:4500;dir:alternate;easing:easeInOutSine">
    </a-sphere>
    <a-light type="ambient" color="#0a1530" intensity="3"></a-light>
    <a-light type="point" position="0 2 -3" color="#00e5a0" intensity="0.3" distance="8"></a-light>
    <a-camera position="0 0 0" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>
  </a-scene>
</div>

<!-- Login Card -->
<div id="login-overlay">
  <div id="login-card">

    <div class="logo-row">
      <h1>CENTRIS</h1>
      <p>Leadership OS &nbsp;·&nbsp; Neural Academy</p>
    </div>

    <div class="sep"></div>

    <div class="field">
      <label>GAME ID</label>
      <input
        id="input-gameid"
        type="text"
        placeholder="ej: CM.RODRIGUEZ"
        maxlength="24"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="characters"
        spellcheck="false"
      >
    </div>

    <div class="field">
      <label>CONTRASEÑA</label>
      <input
        id="input-pass"
        type="password"
        placeholder="••••••••"
        maxlength="32"
        autocomplete="current-password"
      >
    </div>

    <div id="status"></div>

    <div class="btn-row">
      <button id="btn-clear">LIMPIAR</button>
      <button id="btn-login">INGRESAR →</button>
    </div>

    <div class="hint">
      En Quest: apunta al campo con el control<br>
      <span>Trigger</span> para activar · el teclado aparece solo
    </div>

  </div>
</div>

<script>
// ══════════════════════════════════════════
//  CENTRIS VR LOGIN
// ══════════════════════════════════════════

const SUPA_URL = 'https://biebfwwkukmxulzwpjya.supabase.co';
const SUPA_KEY = 'sb_publishable_X13ybEk5Wl0a3e-XHhM5ew_IQcDk3wu';

// Loading out
window.addEventListener('load', () => {
  setTimeout(() => {
    const l = document.getElementById('loading');
    l.style.opacity = '0';
    setTimeout(() => l.style.display = 'none', 600);
    // Focus automático al campo Game ID
    document.getElementById('input-gameid').focus();
  }, 800);
});

// Auto-mayúsculas en Game ID
document.getElementById('input-gameid').addEventListener('input', function() {
  const pos = this.selectionStart;
  this.value = this.value.toUpperCase();
  this.setSelectionRange(pos, pos);
});

// Enter en cualquier campo → login
document.getElementById('input-gameid').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('input-pass').focus();
});
document.getElementById('input-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// Botones
document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('btn-clear').addEventListener('click', () => {
  document.getElementById('input-gameid').value = '';
  document.getElementById('input-pass').value = '';
  document.getElementById('status').textContent = '';
  document.getElementById('status').style.color = '#ff5c5c';
  document.getElementById('input-gameid').focus();
});

function showStatus(msg, color) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = color || '#ff5c5c';
}

// ── LOGIN ─────────────────────────────────
async function doLogin() {
  const gameId = document.getElementById('input-gameid').value.trim().toUpperCase();
  const pass   = document.getElementById('input-pass').value.trim();

  if (!gameId) { showStatus('Ingresa tu Game ID');    document.getElementById('input-gameid').focus(); return; }
  if (!pass)   { showStatus('Ingresa tu contraseña'); document.getElementById('input-pass').focus();   return; }

  // Deshabilitar botón mientras procesa
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Verificando…';
  showStatus('Conectando…', '#00e5a0');

  try {
    const email = gameId + '@leadershipos.app';
    const res   = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPA_KEY },
      body:    JSON.stringify({ email, password: pass })
    });
    const data = await res.json();

    if (!res.ok || data.error) {
      showStatus(data.error_description || 'Game ID o contraseña incorrectos');
      btn.disabled = false;
      btn.textContent = 'INGRESAR →';
      return;
    }

    // Guardar igual que auth.js
    localStorage.setItem('ldr_session_token',  data.access_token);
    if (data.refresh_token)
      localStorage.setItem('ldr_refresh_token', data.refresh_token);

    showStatus('¡Bienvenido ' + gameId + '!', '#00e5a0');
    btn.textContent = '✓ Entrando…';
    btn.style.background = '#00e5a0';
    btn.style.color = '#0d1628';

    setTimeout(() => { window.location.href = 'world.html'; }, 900);

  } catch(e) {
    showStatus('Error de conexión. Intenta de nuevo.');
    btn.disabled = false;
    btn.textContent = 'INGRESAR →';
  }
}
</script>
</body>
