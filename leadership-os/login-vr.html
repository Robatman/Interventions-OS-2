<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Centris Leadership OS — VR Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #0d1628; overflow: hidden; }
    #loading {
      position: fixed; inset: 0;
      background: #0d1628;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #e8eeff; font-family: monospace;
      font-size: 1.2rem; z-index: 999;
      transition: opacity 0.8s;
    }
    #loading .logo { font-size: 2rem; color: #00e5a0; letter-spacing: 0.3em; margin-bottom: 1rem; }
    #loading .sub  { color: #3d6bff; letter-spacing: 0.15em; }
  </style>
</head>
<body>

<div id="loading">
  <div class="logo">CENTRIS</div>
  <div class="sub">Leadership OS — VR Login</div>
  <div style="margin-top:2rem;color:#9d5cff;font-size:0.85rem;">Iniciando Neural Academy…</div>
</div>

<script>
// ══════════════════════════════════════════
//  CENTRIS VR LOGIN — lógica completa
//  Idéntica a auth.js de la app principal
// ══════════════════════════════════════════

const SUPABASE_URL = 'https://biebfwwkukmxulzwpjya.supabase.co';
const SUPABASE_KEY = 'sb_publishable_X13ybEk5Wl0a3e-XHhM5ew_IQcDk3wu';

// ─── ESTADO ───────────────────────────────
let activeField = 'gameid';   // 'gameid' | 'pass'
let fieldValues = { gameid: '', pass: '' };
let cooldown    = false;      // evita doble-registro

// ─── HELPERS DE DISPLAY ───────────────────
function updateDisplay() {
  const gEl = document.getElementById('input-gameid');
  const pEl = document.getElementById('input-pass');
  if (!gEl || !pEl) return;

  const gVal = fieldValues.gameid.length > 15
    ? '…' + fieldValues.gameid.slice(-14)
    : fieldValues.gameid;
  const pMask = '*'.repeat(fieldValues.pass.length);

  gEl.setAttribute('text', 'value', gVal + (activeField === 'gameid' ? '▌' : ''));
  pEl.setAttribute('text', 'value', pMask + (activeField === 'pass'   ? '▌' : ''));
}

function showStatus(msg, color) {
  const el = document.getElementById('status-msg');
  if (!el) return;
  el.setAttribute('text', 'value', msg);
  el.setAttribute('text', 'color', color || '#ff5c5c');
}

function setActiveField(field) {
  activeField = field;
  const tabG = document.getElementById('tab-gameid');
  const tabP = document.getElementById('tab-pass');
  if (tabG) tabG.setAttribute('material', `color: ${field === 'gameid' ? '#3d6bff' : '#162040'}; opacity:0.9; shader:flat; side:double`);
  if (tabP) tabP.setAttribute('material', `color: ${field === 'pass'   ? '#9d5cff' : '#162040'}; opacity:0.9; shader:flat; side:double`);
  updateDisplay();
}

// ─── MANEJO DE TECLA (con cooldown anti-doble) ─
function handleKey(char) {
  if (cooldown) return;
  cooldown = true;
  setTimeout(() => { cooldown = false; }, 200);  // 200ms entre teclas

  if (char === 'BACKSPACE') {
    fieldValues[activeField] = fieldValues[activeField].slice(0, -1);
  } else {
    if (fieldValues[activeField].length < 24) {
      fieldValues[activeField] += char;
    }
  }
  updateDisplay();
  showStatus('');
}

// ─── AUTH — idéntico a loginUser() en auth.js ─
async function doLogin() {
  const gameId   = fieldValues.gameid.trim().toUpperCase();
  const password = fieldValues.pass.trim();

  if (!gameId)   { showStatus('Ingresa tu Game ID');    return; }
  if (!password) { showStatus('Ingresa tu contraseña'); return; }

  showStatus('Verificando…', '#00e5a0');

  try {
    const email = gameId + '@leadershipos.app';
    const res   = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
      body:    JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok || data.error) {
      showStatus(data.error_description || 'Game ID o contraseña incorrectos');
      return;
    }

    // Guardar exactamente igual que auth.js
    localStorage.setItem('ldr_session_token',  data.access_token);
    if (data.refresh_token)
      localStorage.setItem('ldr_refresh_token', data.refresh_token);

    showStatus('¡Bienvenido ' + gameId + '!', '#00e5a0');
    setTimeout(() => { window.location.href = 'world.html'; }, 1000);

  } catch (err) {
    showStatus('Error de conexión');
    console.error(err);
  }
}

// ─── SETUP INTERACTIVIDAD ─────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Ocultar loading
  setTimeout(() => {
    const l = document.getElementById('loading');
    if (l) { l.style.opacity = '0'; setTimeout(() => l.style.display = 'none', 700); }
  }, 900);

  // Teclas del teclado — solo en el <a-plane> con clase .key, NO en hijos
  document.querySelectorAll('a-plane.key').forEach(el => {
    const char = el.getAttribute('data-char');
    if (!char) return;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      handleKey(char);
      flashKey(el, char);
    });

    el.addEventListener('mouseenter', () => {
      if (!cooldown) highlightKey(el, char, true);
    });
    el.addEventListener('mouseleave', () => {
      highlightKey(el, char, false);
    });
  });

  // Tabs de campo
  document.getElementById('tab-gameid')?.addEventListener('click', (e) => {
    e.stopPropagation();
    setActiveField('gameid');
  });
  document.getElementById('tab-pass')?.addEventListener('click', (e) => {
    e.stopPropagation();
    setActiveField('pass');
  });

  // Botón INGRESAR
  document.getElementById('btn-login')?.addEventListener('click', (e) => {
    e.stopPropagation();
    doLogin();
  });

  // Botón BORRAR
  document.getElementById('btn-backspace')?.addEventListener('click', (e) => {
    e.stopPropagation();
    handleKey('BACKSPACE');
  });

  // Controladores Quest 3
  setupControllers();

  updateDisplay();
  setActiveField('gameid');
});

// ─── FLASH / HIGHLIGHT ────────────────────
function getBaseColor(char) {
  if (char === ' ')  return '#3d6bff';
  const row1 = 'QWERTYUIOP';
  const row3 = 'ZXCVBNM';
  if (row1.includes(char) || row3.includes(char)) return '#1a2850';
  return '#162040';
}

function highlightKey(el, char, on) {
  const base = getBaseColor(char);
  const col  = on ? '#3d6bff' : base;
  el.setAttribute('material', `color: ${col}; opacity: 0.92; shader: flat; side: double`);
}

function flashKey(el, char) {
  el.setAttribute('material', 'color: #00e5a0; opacity: 1; shader: flat; side: double');
  setTimeout(() => highlightKey(el, char, false), 130);
}

// ─── CONTROLADORES QUEST 3 ────────────────
function setupControllers() {
  const scene = document.querySelector('a-scene');
  if (!scene) return;

  scene.addEventListener('loaded', () => {
    // Controlador derecho
    const rc = document.createElement('a-entity');
    rc.setAttribute('oculus-touch-controls', 'hand: right');
    rc.setAttribute('raycaster', 'objects: .clickable; far: 6; showLine: true; lineColor: #00e5a0; lineOpacity: 0.7');
    scene.appendChild(rc);

    // Controlador izquierdo
    const lc = document.createElement('a-entity');
    lc.setAttribute('oculus-touch-controls', 'hand: left');
    lc.setAttribute('raycaster', 'objects: .clickable; far: 6; showLine: true; lineColor: #9d5cff; lineOpacity: 0.5');
    scene.appendChild(lc);

    // Trigger → click en elemento intersectado
    [rc, lc].forEach(ctrl => {
      ctrl.addEventListener('triggerdown', () => {
        const hit = ctrl.components?.raycaster?.intersectedEls?.[0];
        if (hit) hit.click();
      });
    });
  });
}
</script>
